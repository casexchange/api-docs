          nullable: true
          description: Masked while SENT
        clientLastName:
          type: string
          nullable: true
          description: Masked while SENT
        clientEmail:
          type: string
          nullable: true
          description: Masked while SENT
        clientPhone:
          type: string
          nullable: true
          description: Masked while SENT
