      type: object
      description: >-
        Where the effective sending-firm fee percentage came from. `percentage` is the EFFECTIVE value —
        `sendingFirmPercentage` on the referral is the raw send-time stamp and stays null for un-stamped referrals. The
        sending firm's rule schedule itself is never exposed.
      properties:
        kind:
          type: string
          enum:
            - locked
            - estimated
            - pending
            - none
          description: >-
            locked = the referral's stamped send-time snapshot; estimated = read-time resolution against current
            agreements as of the sent date; pending = a resolved fee structure is awaiting outcome facts (see
            missingFacts); none = nothing stamped and nothing resolves.
        resolvedAsOf:
          type: string
          format: date
          nullable: true
          description: Platform date (YYYY-MM-DD) the resolution ran against; null when kind is 'locked'
        percentage:
          type: number
          nullable: true
          description: Effective whole-number percent (33.33 = 33.33%); null for pending/none
        coverageLapsed:
          type: boolean
          description: Present (true) when the matched agreement no longer covers the referral
        missingFacts:
          type: array
          items:
            type: string
            enum:
              - settlement_amount
              - cfa_percentage
              - litigation_phase
              - rate_structure
          description: "Present when kind is 'pending': the outcome facts needed to finalize the percentage"
      required:
        - kind
        - resolvedAsOf
        - percentage
