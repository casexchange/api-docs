        - in: query
          name: signedStartDate
          schema:
            type: string
            format: date
          description: Filter by signed date (from) (YYYY-MM-DD)
        - in: query
          name: signedEndDate
          schema:
            type: string
            format: date
          description: Filter by signed date (to) (YYYY-MM-DD)
        - in: query
          name: tz
          schema:
            type: string
          description: IANA time zone used for date bucketing, e.g. America/New_York
        - in: query
          name: caseType
          schema:
            type: string
          description: Restrict to one case type
        - in: query
          name: jurisdiction
          schema:
            type: string
          description: Restrict to one jurisdiction
        - in: query
          name: firmId
          schema:
            type: string
            format: uuid
