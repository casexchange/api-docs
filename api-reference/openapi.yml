openapi: 3.0.3
info:
  title: CaseXchange Public API
  version: 1.0.0
  description: |-
    The CaseXchange Public API enables law firms to integrate referral management
    directly into their own systems.

    ## Authentication
    All requests must include an `X-API-Key` header containing a valid API key
    (format: `cxp_<hex>`). Keys are scoped to a firm and an access tier.

    ## Access Tiers
    | Tier | Description |
    |------|-------------|
    | `read_only` | GET endpoints — read data without mutation |
    | `standard` | read_only + create/update case referrals |
    | `full` | standard + delete, routing rules, bulk import, firm mutation |

    ## Rate Limiting
    Rate limits are enforced per API key. Exceeded limits return `429 Too Many Requests`.

    ## Pagination
    List endpoints accept `page` (default 1) and `limit` (default 20, max 100) query params.

    ## Response Format
    Successful responses are wrapped in `{ data: T, meta: { requestId, timestamp } }`.
    Errors are wrapped in `{ error: { code, message }, meta: { requestId, timestamp } }`.
  contact:
    name: CaseXchange API Support
    url: https://casexchange.com
servers:
  - url: https://api.casexchange.com/api/public/v1
    description: Production Public API base path
  - url: /api/public/v1
    description: Relative base path (for proxied docs/local environments)
tags:
  - name: Account
    description: Identity of the calling API key and its firm
  - name: Referrals
    description: Referral records visible to the caller's firm as sender or receiver, and the lifecycle transitions on them
  - name: Received Referrals
    description: Receiver-centric view of referrals sent TO the caller's firm, addressable by UUID, reference number or CMS id
  - name: Sent Cases
    description: "Sender-side case management: create, track, and refer/route cases you own"
  - name: Status Updates
    description: Status-history and partner-message entries across the caller's referrals
  - name: Messages
    description: Partner messaging on a referral
  - name: Cases
    description: >-
      Legacy referral endpoints keyed by referral UUID, served from either party's perspective. Prefer Referrals,
      Received Referrals and Sent Cases for new integrations.
  - name: Documents
    description: Document upload, download, and management
  - name: Reference Data
    description: Case types, jurisdictions, and counties
  - name: Firms
    description: Firm directory and profile management
  - name: Network
    description: >-
      Referral relationships between the caller's firm and other firms. `outbound` is a relationship the caller sends
      referrals through (caller → target firm); `inbound` is one where the caller receives (source firm → caller).
      Requires a firm-scoped API key.
  - name: Routing
    description: Referral routing rules
  - name: Analytics
    description: Dashboard and case analytics
  - name: Export
    description: >-
      XLSX/CSV downloads of analytics and case data. Responses are binary attachments rather than the JSON envelope.
      Export endpoints carry an additional limit of 10 requests per API key per sliding minute, on top of the tier rate
      limits.
  - name: Import
    description: Bulk case import/update via CSV
  - name: Notifications
    description: Notification preferences and email management
  - name: Users
    description: User management within the caller's firm
  - name: External Links
    description: >-
      Links between a CaseXchange referral and a record in an external case-management system. Supported systems:
      `cloudlex`, `morgan_morgan`. Requires a firm-scoped API key.
  - name: Webhooks
    description: >-
      Outbound event subscriptions for Med Xchange providers. Webhook endpoints require a **provider-scoped** API key
      (`cxpp_*`); firm-scoped keys receive `403 wrong_scope`.


      Each delivery is an HTTPS POST of a JSON body `{ event, timestamp, data }` with headers `X-CaseXchange-Event`
      (event name), `X-CaseXchange-Delivery` (delivery UUID) and `X-CaseXchange-Signature` in the form
      `t=<unix-seconds>,v1=<hex>`, where `v1` is HMAC-SHA256(secret, `<t>.<rawBody>`). Failed deliveries are retried
      with back-off up to 5 attempts (10-second request timeout); after that the delivery is marked `EXHAUSTED`.


      Event types: `webhook.test`, `case.created`, `case.updated`, `case.archived`, `referral.sent`,
      `appointment.created`, `appointment.updated`, `appointment.deleted`, `billing.created`, `billing.updated`,
      `billing.deleted`, `diagnosis.created`, `diagnosis.updated`, `diagnosis.deleted`, `document.uploaded`,
      `document.deleted`, `injury.created`, `injury.updated`, `injury.deleted`, `insurance.created`,
      `insurance.updated`, `insurance.deleted`, `note.created`, `note.updated`, `note.deleted`, `prescription.created`,
      `prescription.updated`, `prescription.deleted`.
  - name: Med Cases
    description: Med Xchange cases and their nested referrals to medical providers
  - name: MedEx Documents
    description: Med Xchange case document listing and download
  - name: SSO
    description: Partner-initiated Med Xchange single sign-on. Requires a provider-scoped API key (`cxpp_*`).
  - name: Salesforce
    description: Org-facing endpoints consumed by the CaseXchange managed package
  - name: Extension
    description: Telemetry reported by the CaseXchange browser extension
  - name: Health
    description: Unauthenticated liveness probe
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Public API key (starts with cxp_). Required on every request.
  schemas:
    Firm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        isInternal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    Case:
      type: object
      description: >-
        A referral as seen by either party (the public API calls a referral a "case" on this path). Base-case fields are
        flattened onto the referral. Client fields are masked for SENT-status cases viewed by the receiving firm until
        acknowledged.
      properties:
        id:
          type: string
          format: uuid
          description: Referral UUID
        baseCaseId:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
          example: ABC-0001
        status:
          type: string
          description: CaseStatus enum value (legacy RECEIVED is published as under_evaluation).
        closingStatus: &ref_0
          type: string
          nullable: true
          enum:
            - won_settled
            - lost
            - no_longer_pursuing
          description: ClosingStatus enum value; null until the closing workflow starts.
        payoutType: &ref_1
          type: string
          nullable: true
          enum:
            - lump_sum
            - structured
            - hybrid
            - other
          description: How settlement funds are distributed; null until set during closing.
        closureReason: &ref_2
          type: string
          nullable: true
          description: Free-text reason recorded when the referral is closed; null until then.
        settlementAmount: &ref_3
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Final settlement amount in dollars; null until recorded.
        attorneyFees: &ref_4
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Total attorney fees in dollars; null until recorded.
        clientFeeAgreementPercentage: &ref_5
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: >-
            Client fee agreement as a FRACTION of the settlement, 0–1 (0.3333 = 33.33%). Not a whole percent — contrast
            with sendingFirmPercentage.
        projectedSettlementAmount: &ref_6
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Projected settlement amount in dollars, set while the case is open; null until estimated.
        estimatedDateOfResolution: &ref_7
          type: string
          format: date-time
          nullable: true
          description: Estimated resolution date (date-only on input, ISO 8601 on output); null until estimated.
        estimatedDistributionDate: &ref_8
          type: string
          format: date-time
          nullable: true
          description: Estimated distribution date (date-only on input, ISO 8601 on output); null until estimated.
        leadAttorneyName: &ref_9
          type: string
          nullable: true
          description: Lead attorney at the receiving firm; null until set.
        referringFirmId:
          type: string
          format: uuid
          description: Sending firm
        referentFirmId:
          type: string
          format: uuid
          nullable: true
          description: Receiving firm
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        caseType:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        county:
          type: string
          nullable: true
        clientFirstName:
          type: string
          nullable: true
        clientLastName:
          type: string
          nullable: true
        clientEmail:
          type: string
          format: email
          nullable: true
        clientPhone:
          type: string
          nullable: true
        clientDateOfBirth:
          type: string
          format: date
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
          description: The sending firm's aggregated case notes.
        warmTransferSuccessful:
          type: boolean
          description: Whether the warm transfer to the receiving firm succeeded.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Null until the referral is acknowledged (PII masking) when
            viewed by the receiving firm.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: >-
            Reason category for an unsuccessful warm transfer. Null until the referral is acknowledged (PII masking)
            when viewed by the receiving firm.
        sendingFirmPercentage:
          type: number
          nullable: true
          description: Referral fee owed to the sending firm as a whole-number percent of attorney fees (33.33 = 33.33%).
        netFeeToSendingFirm:
          type: number
          nullable: true
          description: >-
            attorneyFees × the sendingFirmPercentage published on this record ÷ 100, rounded to cents. Null when either
            input is missing or zero.
        netFeeToHandlingFirm:
          type: number
          nullable: true
          description: attorneyFees − netFeeToSendingFirm. Null when netFeeToSendingFirm is null.
        resolutionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the outcome was recorded: the most recent transition into CLOSING, or into WON/LOST for legacy
            referrals that never passed through CLOSING.
        closedDate:
          type: string
          format: date-time
          nullable: true
          description: The most recent transition into CLOSED.
        statuteOfLimitationsExpiration:
          type: string
          format: date-time
          nullable: true
        phase:
          type: string
          nullable: true
        isRetainerSigned:
          type: boolean
        sentDate:
          type: string
          format: date-time
          nullable: true
        signedDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time
    MedCaseDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Document handle (MedCaseDocument junction id)
        fileName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
          description: Raw byte size
        category:
          type: string
        source:
          type: string
          enum:
            - upload
            - litify_sync
            - premier_sync
        uploadedAt:
          type: string
          format: date-time
        pending:
          type: boolean
          description: If true, bytes are not yet materialized; first fetch may be slower.
        sharedWithProviders:
          type: boolean
          description: >-
            Whether providers on the case can currently see this document. Provider-scoped keys never receive hidden
            documents, so this is always true for them; firm-scoped keys see hidden documents flagged false.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          description: UserRole enum value
        isActive:
          type: boolean
        firmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    RoutingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        conditions:
          type: array
          items:
            type: object
        targetFirmId:
          type: string
          format: uuid
        priority:
          type: integer
        isActive:
          type: boolean
        firmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SentCase:
      type: object
      description: >-
        A case from the sender (owning firm) perspective. Referral-level fields at the top level are the most recent
        referral's; `referrals` carries every referral on the case.
      properties:
        id:
          type: string
          format: uuid
          description: Base case UUID
        referenceNumber:
          type: string
          nullable: true
          example: ABC-0001
        salesforceId:
          type: string
          nullable: true
        salesforceObjectType:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        caseType:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        county:
          type: string
          nullable: true
        clientAddress1:
          type: string
          nullable: true
        clientAddress2:
          type: string
          nullable: true
        clientCity:
          type: string
          nullable: true
        clientPostalCode:
          type: string
          nullable: true
        clientFirstName:
          type: string
          nullable: true
        clientLastName:
          type: string
          nullable: true
        clientEmail:
          type: string
          format: email
          nullable: true
        clientPhone:
          type: string
          nullable: true
        clientDateOfBirth:
          type: string
          format: date-time
          nullable: true
        incidentDate:
          type: string
          format: date-time
          nullable: true
        tier:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: >-
            Sender-assigned case rating (1 = highest priority, 5 = lowest). Distinct from the API key access tier. Null
            when unrated.
        ratedTier:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Reserved for a future rating workflow; not currently populated.
        ratingNotes:
          type: string
          nullable: true
          description: Reserved for a future rating workflow; not currently populated.
        source:
          type: string
          nullable: true
        isTestCase:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          description: Most recent referral's CaseStatus; `draft` when the case has no referral.
        closingStatus: *ref_0
        payoutType: *ref_1
        closureReason: *ref_2
        settlementAmount: *ref_3
        attorneyFees: *ref_4
        clientFeeAgreementPercentage: *ref_5
        projectedSettlementAmount: *ref_6
        estimatedDateOfResolution: *ref_7
        estimatedDistributionDate: *ref_8
        leadAttorneyName: *ref_9
        warmTransferSuccessful:
          type: boolean
          description: Whether the warm transfer to the receiving firm succeeded.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Unmasked here — this is the sending firm's own data.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: Reason category for an unsuccessful warm transfer. Unmasked here — this is the sending firm's own data.
        netFeeToSendingFirm:
          type: number
          nullable: true
          description: >-
            attorneyFees × the receiving firm's stamped sending-firm percentage ÷ 100, rounded to cents (the percentage
            itself is not exposed on this resource). Null when either input is missing or zero.
        netFeeToHandlingFirm:
          type: number
          nullable: true
          description: attorneyFees − netFeeToSendingFirm. Null when netFeeToSendingFirm is null.
        resolutionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the outcome was recorded: the most recent transition into CLOSING, or into WON/LOST for legacy
            referrals that never passed through CLOSING.
        closedDate:
          type: string
          format: date-time
          nullable: true
          description: The most recent transition into CLOSED.
        statuteOfLimitationsExpiration:
          type: string
          format: date-time
          nullable: true
        phase:
          type: string
          nullable: true
        requiresUpdate:
          type: boolean
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldValue"
        referrals:
          type: array
          description: All referrals on this case, most recent first.
          items:
            $ref: "#/components/schemas/SentCaseReferralSummary"
    SentCaseListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
        salesforceId:
          type: string
          nullable: true
        receivingFirmName:
          type: string
          nullable: true
        receivingFirmId:
          type: string
          format: uuid
          nullable: true
        owningFirmId:
          type: string
          format: uuid
          nullable: true
        owningFirmName:
          type: string
          nullable: true
        status:
          type: string
          description: CaseStatus enum value
        closingStatus:
          type: string
          nullable: true
        tier:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: >-
            Sender-assigned case rating (1 = highest priority, 5 = lowest). Distinct from the API key access tier. Null
            when unrated.
        warmTransferSuccessful:
          type: boolean
          description: >-
            Whether the sending firm's warm transfer to the receiving firm succeeded. Sourced from the most-recent
            referral.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Unmasked here — this is the sending firm's own data.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: Reason category for an unsuccessful warm transfer.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SentCaseReferralSummary:
      type: object
      description: >-
        One referral on a sent case, most recent first. Carries that referral's own settlement and outcome so a
        re-referred case shows each attempt, not just the most recent one flattened onto the parent.
        sendingFirmPercentage and isRetainerSigned are receiver-managed and omitted.
      properties:
        id:
          type: string
          format: uuid
        referentFirmId:
          type: string
          format: uuid
          nullable: true
        referentFirmName:
          type: string
          nullable: true
        status:
          type: string
          description: CaseStatus enum value
        closingStatus: *ref_0
        payoutType: *ref_1
        closureReason: *ref_2
        settlementAmount: *ref_3
        attorneyFees: *ref_4
        clientFeeAgreementPercentage: *ref_5
        projectedSettlementAmount: *ref_6
        estimatedDateOfResolution: *ref_7
        estimatedDistributionDate: *ref_8
        leadAttorneyName: *ref_9
        netFeeToSendingFirm:
          type: number
          nullable: true
          description: >-
            attorneyFees × the receiving firm's stamped sending-firm percentage ÷ 100, rounded to cents (the percentage
            itself is not exposed on this resource). Null when either input is missing or zero.
        netFeeToHandlingFirm:
          type: number
          nullable: true
          description: attorneyFees − netFeeToSendingFirm. Null when netFeeToSendingFirm is null.
        resolutionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the outcome was recorded: the most recent transition into CLOSING, or into WON/LOST for legacy
            referrals that never passed through CLOSING.
        closedDate:
          type: string
          format: date-time
          nullable: true
          description: The most recent transition into CLOSED.
        notes:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        lastUpdatedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseTypeField:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        fieldType:
          type: string
        displayOrder:
          type: integer
        isRequired:
          type: boolean
        enumOptions:
          type: array
          nullable: true
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: string
        validationRule:
          type: object
          nullable: true
          properties:
            min:
              type: number
            max:
              type: number
            maxLength:
              type: integer
    AvailableFirm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        jurisdictions:
          type: array
          items:
            type: string
        caseTypes:
          type: array
          items:
            type: string
        referralInstructions:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - network
            - directory
          description: Whether the firm is in your private network or only in the public directory.
    BulkUpdateJob:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
        fileName:
          type: string
          nullable: true
        operationType:
          type: string
        totalRows:
          type: integer
          nullable: true
        processedRows:
          type: integer
        successfulRows:
          type: integer
        failedRows:
          type: integer
        progressPercent:
          type: integer
          nullable: true
        resultSummary:
          type: object
          nullable: true
        errorMessage:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoutingEvaluation:
      type: object
      nullable: true
      description: The routing decision for a case profile, or null when no active rule matches.
      properties:
        rule:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        selectedFirmId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The firm the round-robin pointer currently selects — send here. Null when the pick is an external-contact
            assignment (no CaseXchange firm).
        roundRobinPosition:
          type: integer
          description: >-
            Opaque echo token — pass this back unchanged as roundRobinPosition (with rule.id as routingRuleId) into POST
            /sent-cases or POST /sent-cases/{id}/refer to advance the rule's round-robin pointer server-side. It is NOT
            an index into the assignments array returned here; to find the rotation's pick, use assignments[0] or match
            selectedFirmId.
        assignments:
          type: array
          description: >-
            The matched rule's active assignments that are eligible for this attempt (inside their attempt window and,
            for /routing/re-refer, not a firm that already holds the case), ordered starting at the round-robin
            selection (then the rest of the configured order, wrapping). assignments[0] is always the rotation's pick —
            the same firm as selectedFirmId when the pick is a CaseXchange firm. When the pick is an external-contact
            assignment, assignments[0].firmId (and selectedFirmId) are null — callers that send to assignments[0] must
            treat a null firmId as "no auto-routable firm" and fall back to manual selection. The order changes between
            calls as the pointer advances; do not rely on positional stability except that index 0 is the current pick.
