      summary: Get sent-referral analytics
      description: >-
        Extended analytics for referrals the caller's firm has SENT: KPIs, stage breakdown, trend, outcome
        distributions, top receiving firms, and warm-transfer metrics (partner firms in `warmTransfer.byPartnerFirm` are
        receiving firms). Supports the shared extended-analytics query filters (date ranges, case type, jurisdiction,
        tz).
      tags:
        - Analytics
      security: *ref_16
      x-access-tier: read_only
      responses:
        "200":
          description: Sent-referral analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: >-
                      Sent-referral analytics object. Documented here (partially): warmTransfer; other sections (kpis,
                      currentStageBreakdown, trend, trendStats, outcomesOfSent, outcomesOfSigned,
                      referralLooksDistribution, signedCasesByReferralAttempt, topSigningFirms,
                      topCaseTypeJurisdictions) are returned as-is. topSigningFirms ranks receiving firms by cases whose
                      most recent referral is currently signed, in litigation or closing; since 2026-09-08 closed, won
                      and lost cases are not counted. trendStats carries the same volume as the raw daily `trend`,
                      regrouped into a dense day/week/month-bucketed series over [rangeStart, rangeEnd] whose bucket
                      size follows the window span, plus the window total, the mean per bucket, the busiest bucket, and
                      the immediately preceding same-length window's totals when a referral date range is active. An
                      empty bucket carries a count of 0 (a real zero, unlike the duration trends' null). When no date
                      range is requested and a run of volume sits stranded far from the rest of the data — a legacy
                      import dated decades before everything else, which would otherwise stretch the axis across those
                      decades — the range narrows to where the data lives and the stranded volume is reported in
                      `excluded` instead: it stays in `total` but is out of `trend`, `avgPerBucket` and `peak`, so
                      sum(trend) + excluded.count === total. `excluded` is null in the normal case, and an explicitly
                      requested range is never narrowed.
                    properties:
                      warmTransfer:
                        $ref: "#/components/schemas/WarmTransferAnalytics"
                  meta: *ref_12
                required:
                  - data
                  - meta
        "401": *ref_18
        "403": *ref_19
  /analytics/received:
    get:
      operationId: getReceivedAnalytics
      summary: Get received-referral analytics
      description: >-
        Extended analytics for referrals the caller's firm has RECEIVED: KPIs, stage breakdown, pipeline, trends,
        outcome distributions, top sending firms, and warm-transfer metrics (partner firms in
        `warmTransfer.byPartnerFirm` are sending firms). Supports the shared extended-analytics query filters (date
        ranges, case type, jurisdiction, tz).
      tags:
        - Analytics
      security: *ref_16
      x-access-tier: read_only
      responses:
        "200":
          description: Received-referral analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: >-
                      Received-referral analytics object. Documented here (partially): warmTransfer; other sections
                      (kpis, currentStageBreakdown, currentStageStats, activePipeline, activePipelineFlow,
                      timeToAcknowledgeTrend, timeToAcknowledgeStats, timeToSignTrend, timeToSignStats,
                      outcomesOfReceived, outcomesReceivedStats, outcomesOfClosed, outcomesClosedStats, topSendingFirms,
                      topCaseTypeJurisdictions) are returned as-is. timeToAcknowledgeStats carries case-level
                      mean/median/p90 (acknowledgements above outlierThresholdHours are excluded from every average and
                      counted separately), a dense day/week/month-bucketed trend over [rangeStart, rangeEnd] where
                      avgHours is null for buckets with no acknowledgements, and a previous-window comparison when a
                      referral date range is active. timeToSignStats carries the same shape for sent-to-signed durations
                      in days (threshold 365), bucketed on the signed date. activePipelineFlow carries the five active
                      stages in flow order with, per stage, the current count, its share of the active total, the number
                      of referrals that ever reached it, and the percentage of those that ever reached the next stage
                      (measured on status history, so it never exceeds 100%), plus trailing-30-day throughput figures
                      each with the preceding window beside it. currentStageStats carries every stage with a case in it
                      now or 30 days ago, busiest first, each with its current count, its occupancy 30 days ago
                      (replayed from status history, not from a stored snapshot) and its share of the total.
                      outcomesReceivedStats and outcomesClosedStats each carry the outcome mix in a fixed order (so a
                      slice keeps its colour as counts move), every row with a display label, its count and its share,
                      plus the total and the immediately preceding window's total.
                    properties:
                      warmTransfer:
                        $ref: "#/components/schemas/WarmTransferAnalytics"
                  meta: *ref_12
                required:
                  - data
                  - meta
        "401": *ref_18
        "403": *ref_19
