        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
          description: Document handle (junction id)
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum:
              - url
              - base64
            default: url
      responses:
        "200":
          description: Presigned URL (default) or base64 document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
                          id:
                            type: string
                          fileName:
                            type: string
                          contentType:
                            type: string
                          fileSize:
                            type: integer
                          downloadUrl:
                            type: string
                            format: uri
                          expiresAt:
                            type: string
                            format: date-time
                      - type: object
                        properties:
                          id:
                            type: string
                          fileName:
                            type: string
                          contentType:
                            type: string
                          fileSize:
                            type: integer
                          encoding:
                            type: string
                            enum:
