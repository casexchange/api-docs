        "200":
          description: Bulk update job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BulkUpdateJob"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "401": *ref_23
        "403": *ref_24
        "404": *ref_26
  /salesforce/send-mapping:
    get:
      operationId: getSalesforceSendMapping
      summary: Get the active sending-profile mapping for an object/record-type
      description: >-
        Org-facing mapping fetch for the managed package's send LWC: match key, prefill fields, writeback fields, and
        the resolved send-field catalog for the firm's active, activated, interactive-send-enabled v2 sending profile
        matching the given object and record type. An exact record-type match wins; if no profile matches that record
        type exactly, a profile configured with no record type ("Any record type") serves as the wildcard fallback.
        Requires FULL tier.
      tags:
        - Salesforce
      security: *ref_21
      x-access-tier: full
      parameters:
        - name: sfObjectApiName
          in: query
          required: true
          schema:
            type: string
          description: Salesforce object API name, e.g. litify_pm__Matter__c
        - name: sfRecordTypeDevName
          in: query
          schema:
            type: string
          description: >-
            Optional record type developer name. Falls back to a profile with no record type set ("Any record type");
            omit to match only that profile.
      responses:
        "200":
          description: Send mapping for the given object/record type
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SendMapping"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "400": *ref_22
        "401": *ref_23
        "403": *ref_24
        "404": *ref_26
  /salesforce/interactive-sends:
    post:
      operationId: createSalesforceInteractiveSend
      summary: Send a Salesforce record to CaseXchange as a new case or re-referral
      description: >-
        Turns an org-side "send this record to CaseXchange" submit into a durable, idempotent CaseXchange case creation
        (or re-referral to a new firm) — spec §7.2. Reads the source record from Salesforce using the firm's active,
        activated, interactive-send-enabled v2 sending profile, applies its confirmed prefill links plus any
        `overrides`, and creates (or re-refers) a case.


        Idempotency: pass a fresh `idempotencyKey` (UUID) on every distinct submit. Replaying the same key returns the
        original outcome with `200` and `attempt.replay: true` instead of creating a duplicate case; a genuinely new
        submit must use a new key.


        Observing write-back: there is NO status-check endpoint. Once this call returns, the CaseXchange case exists,
        but its bridge fields (match key, status, reference number, deep link) are stamped back onto the source
        Salesforce record asynchronously by the write-back job — observe completion by reading those fields on the
        source record (typically within ~5 minutes). A send that exhausts its write-back retries moves to
        `needs_attention` and is paused for an admin; that state sends NO signal to the org side, so clients should
        surface a send whose fields remain unstamped after a timeout as stale rather than wait indefinitely.


        Error codes (409s carry a per-code `error.details` object — see the 409 response):

        - `400 match_key_missing` — the resolved sending profile has no match key configured at all (send is not
        supported); an external-ID or lookup match key is required.

        - `400 validation_error` — the built create payload failed validation; `error.details.errors` carries the
        field-level issues.

        - `400 bad_request` — a re-refer business-rule rejection propagated from the re-referral service (e.g. the case
        is not in a re-referable status, or no prior referral exists); the message is descriptive.

        - `404 send_mapping_not_configured` — no active, activated, interactive-send-enabled v2 sending profile matches
        the given object/record type (exact record-type match, falling back to the "Any record type" profile).

        - `404 source_record_not_found` — sourceRecordId does not exist (or is not visible) in Salesforce.

        - `404 linked_case_not_found` — reRefer was requested but no linked CaseXchange case exists for this record (or
        it no longer exists).

        - `409 record_already_sent` — the record is already linked to a CaseXchange case and reRefer was not requested.
        `error.details`: `{ baseCaseId, referenceNumber }` (the existing case, so the client can offer re-refer).

        - `409 record_already_linked` — the record already carries a match-key value from a prior send with no active
        link. `error.details`: `{ matchKeyValue }`.

        - `409 send_in_progress` — a send for this record (or idempotency key) is already in flight. `error.details`: `{
        retryAfterMs }` — the remaining in-flight window (floored at 0) to back off before retrying.

        - `409 attempt_failed` — a previous send with this idempotency key failed; submit a fresh key to retry.
        `error.details`: `{ failureCode, lastError }`.

        - `502 salesforce_unavailable` — no usable Salesforce access token for this connection.

        - `502 salesforce_read_failed` — the Salesforce SOQL read of the source record failed.


        Requires FULL tier.
      tags:
        - Salesforce
      security: *ref_21
      x-access-tier: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceRecordId
                - sfObjectApiName
                - targetFirmIds
                - idempotencyKey
              properties:
                sourceRecordId:
                  type: string
                  pattern: ^[a-zA-Z0-9]{15,18}$
                  description: Salesforce record Id (15 or 18 char) of the source record being sent.
                sfObjectApiName:
                  type: string
                  description: Salesforce object API name, e.g. litify_pm__Matter__c.
                sfRecordTypeDevName:
                  type: string
                  nullable: true
                  description: Record type developer name. Omit or null to match profiles with no record type set.
                targetFirmIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 1
                  description: >-
                    Receiving firm id(s) for this send. Array-shaped for forward compatibility, but CaseXchange supports
                    exactly one active referral per case — exactly one target firm per send today.
                overrides:
                  type: object
                  additionalProperties:
                    nullable: true
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                  default: {}
                  description: >-
                    Optional per-field overrides keyed by casex.* canonical key. Keys must be one of the
                    interactive-send form fields returned by GET /salesforce/send-mapping (sendFields).
                idempotencyKey:
                  type: string
                  format: uuid
                  description: >-
                    A fresh UUID generated by the caller for each distinct submit. Replaying the same key returns the
                    original outcome (200, attempt.replay: true) instead of creating a duplicate case.
                mappingVersion:
                  type: string
                  maxLength: 64
                  description: >-
                    Observability only, echoed from GET /salesforce/send-mapping. A stale/mismatched value is logged but
                    never rejected — the server always re-reads current mapping config.
                reRefer:
                  type: boolean
                  default: false
                  description: >-
                    When true and the source record is already linked to a CaseXchange case, re-refer that case to
                    targetFirmIds instead of creating a new case.
                notes:
                  type: string
                  maxLength: 10000
                routingRuleId:
                  type: string
                  format: uuid
                  description: >-
                    Optional. Routing rule this send was chosen from (from GET /routing/evaluate). Ignored (with a
                    server-side warning) if it is not a live rule owned by your firm.
                roundRobinPosition:
                  type: integer
                  minimum: 0
                  description: >-
                    Optional. The roundRobinPosition from GET /routing/evaluate. Requires routingRuleId; advances the
                    rule's round-robin pointer when the selected slot is a first-look slot (its attempt window includes
                    attempt 1); re-look-only slots leave the pointer unchanged.
      responses:
        "200":
          description: Replay of a previously processed idempotency key — returns the original outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractiveSendResult"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "201":
          description: New case created (or re-referred) from the source record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractiveSendResult"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "400": *ref_22
        "401": *ref_23
        "403": *ref_24
        "404": *ref_26
        "409":
          description: >-
            Conflict — the `error.code` selects one of four cases, each with a distinct `error.details` shape:

            - `record_already_sent` (already linked; pass reRefer to re-refer instead) — `details: { baseCaseId,
            referenceNumber }`.

            - `record_already_linked` (claimed by a prior send with no active link) — `details: { matchKeyValue }`.

            - `send_in_progress` (a send for this record/key is already in flight) — `details: { retryAfterMs }`, the
            remaining in-flight window in ms (floored at 0).

            - `attempt_failed` (the prior attempt for this idempotency key failed; use a fresh key) — `details: {
            failureCode, lastError }`.
          content: *ref_19
        "502":
          description: >-
            Salesforce unavailable (`salesforce_unavailable`) or the source record read failed
            (`salesforce_read_failed`).
          content: *ref_19
x-webhook-events:
  - event: case.created
    description: A new case was created.
    perspectives:
      - sent
    piiMasked: false
    changedFields: Never.
    recipients: >-
      The sending firm only. Every case is born before the receiving firm can have acknowledged anything; a case born
      already sent produces `referral.received` for the other side.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/CaseSnapshot"
  - event: case.updated
    description: One or more fields on a case changed.
    perspectives:
      - sent
      - received
    piiMasked: false
    changedFields: >-
      Always, when the update carried a diff — intersected with what the recipient may see, plus the sentinel
      `customFields` (not a snapshot field; it means "re-`GET` the case", and a masked recipient never gets it). A
      recipient for whom the intersection is empty is not delivered the event at all. `PATCH /sent-cases/{id}` reports
      the columns it WROTE rather than a value diff, so re-sending an identical value can still produce a `case.updated`
      naming that column.
    recipients: >-
      The sending firm, plus every receiving firm on the case that has acknowledged its own hop and is not in a
      pre-acknowledgment or never-acknowledged terminal state. Referral-level keys (fees, settlement, lead attorney,
      phase) reach only the two parties of the hop that was updated.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/CaseSnapshot"
  - event: case.deleted
    description: A draft case was deleted.
    perspectives:
      - sent
    piiMasked: false
    changedFields: Never.
    recipients: The sending firm only — a DRAFT has no receiving firm.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/CaseTombstone"
  - event: referral.sent
    description: A referral was sent to another firm.
    perspectives:
      - sent
    piiMasked: false
    changedFields: Never.
    recipients: The sending firm. The receiving firm gets `referral.received` for the same fact and `eventId`.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/StatusChangeData"
  - event: referral.received
    description: A referral was received from another firm.
    perspectives:
      - received
    piiMasked: true
    changedFields: Never.
    recipients: >-
      The receiving firm. Masked until that firm has itself acknowledged the referral — which, on a first send, it has
      not.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/StatusChangeData"
    maskedDataSchema: "#/components/schemas/MaskedStatusChangeData"
  - event: referral.accepted
    description: A received referral was acknowledged/accepted.
    perspectives:
      - sent
      - received
    piiMasked: true
    changedFields: Never.
    recipients: >-
      Both firms. Sent when the referral moves out of SENT into UNDER_EVALUATION or INVESTIGATING. This is normally the
      first unmasked delivery a receiving firm gets — but an administrator or an integration can produce the same
      transition without the receiving firm acknowledging, and then it stays masked.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/StatusChangeData"
    maskedDataSchema: "#/components/schemas/MaskedStatusChangeData"
  - event: referral.rejected
    description: A referral was rejected.
    perspectives:
      - sent
      - received
    piiMasked: true
    changedFields: Never.
    recipients: Both firms. A referral rejected without ever being acknowledged stays masked for the receiving firm forever.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/StatusChangeData"
    maskedDataSchema: "#/components/schemas/MaskedStatusChangeData"
  - event: case.status_changed
    description: A case's status changed.
    perspectives:
      - sent
      - received
    piiMasked: true
    changedFields: Never.
    recipients: >-
      Both firms, for every other transition that records a status row — including withdrawal and closing. An
      administrator override such as SENT → SIGNED arrives here, not as `referral.accepted`, and does not unmask the
      receiving firm.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/StatusChangeData"
    maskedDataSchema: "#/components/schemas/MaskedStatusChangeData"
  - event: note.created
    description: A note was added to a case.
    perspectives:
      - sent
      - received
    piiMasked: false
    changedFields: Never.
    recipients: >-
      The firm that owns the note, always — a note is its own content. The counterparty only once it is entitled to case
      content (acknowledged, and the referral in a working state).
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/NoteData"
  - event: note.updated
    description: A note on a case was edited.
    perspectives:
      - sent
      - received
    piiMasked: false
    changedFields: Always `['body']` — the body is the only editable field.
    recipients: Same as `note.created`.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/NoteData"
  - event: document.uploaded
    description: A document was uploaded to a case.
    perspectives:
      - sent
      - received
    piiMasked: false
    changedFields: Never.
    recipients: >-
      The owning firm, plus each counterparty whose hop still grants document access. Document access is stricter than
      case content: it also ends at CLOSED, where `case.updated` and `note.*` keep flowing. Documents attached to a fee
      agreement rather than a case produce no event.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/DocumentData"
  - event: document.deleted
    description: A document was deleted from a case.
    perspectives:
      - sent
      - received
    piiMasked: false
    changedFields: Never.
    recipients: Same as `document.uploaded`.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/DocumentTombstone"
  - event: case.rated
    description: A case's tier/rating was set or changed.
    perspectives:
      - sent
    piiMasked: false
    changedFields: Never.
    recipients: >-
      The owning firm only, acknowledged counterparty or not: a tier is a firm's private appraisal of its own case.
      Because the case snapshot carries no `tier`, this event is the only way to observe one.
    envelopeSchema: "#/components/schemas/CasexWebhookEnvelope"
    dataSchema: "#/components/schemas/CaseRatingData"
