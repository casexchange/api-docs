    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: >-
            The HTTPS endpoint you registered. This field always reports YOUR endpoint, whether or not echo mode is on:
            while echo mode is active CaseXchange delivers to its own echo endpoint instead, but that echo URL is never
            returned by a read, because it embeds the echo token — an unauthenticated write capability against the echo
            ingest. Read `isEchoActive` to tell whether deliveries are currently being diverted; the echo URL and its
            token are returned only by `POST /webhooks/{id}/echo/enable`.
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        isEchoActive:
          type: boolean
          description: >-
            True while echo mode is enabled — deliveries go to the CaseXchange echo endpoint and are readable through
            `GET /webhooks/{id}/echo/captures` instead of reaching `url`. This flag, not `url`, is how you detect echo
            mode: `url` reads the same in both states.
        originalUrl:
          type: string
          format: uri
          nullable: true
          description: >-
            The endpoint saved when echo mode was enabled — identical to `url`, which keeps reporting your endpoint
            throughout, so the two are the same string while echo mode is on. Null whenever echo mode is off. Kept for
            compatibility; prefer `url` for the address and `isEchoActive` for the state.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - url
        - description
        - isActive
        - isEchoActive
        - originalUrl
        - createdAt
        - updatedAt
    WebhookSubscriptionWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookSubscription"
        - type: object
          properties:
            secret:
              type: string
              description: >-
                HMAC signing secret. Returned ONLY from create and rotate-secret — it is never readable again; store it
                immediately.
          required:
            - secret
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - case.created
            - case.updated
            - case.deleted
            - referral.sent
            - referral.received
            - referral.accepted
            - referral.rejected
            - case.status_changed
            - note.created
            - note.updated
            - document.uploaded
            - document.deleted
            - case.rated
            - case.archived
            - injury.created
            - injury.updated
            - injury.deleted
            - insurance.created
            - insurance.updated
            - insurance.deleted
            - appointment.created
            - appointment.updated
            - appointment.deleted
            - prescription.created
            - prescription.updated
            - prescription.deleted
            - diagnosis.created
            - diagnosis.updated
            - diagnosis.deleted
            - billing.created
            - billing.updated
            - billing.deleted
            - note.deleted
            - referral.under_review
            - referral.in_treatment
            - referral.treatment_complete
            - referral.closed
            - referral.withdrawn
            - webhook.test
          description: >-
            Event name. Deliveries for a firm-owned subscription carry a `WebhookEventType` value; deliveries for a
            provider-owned subscription carry a `MedexWebhookEventType` value.
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - IN_PROGRESS
            - DELIVERED
            - FAILED
            - EXHAUSTED
          description: EXHAUSTED means all 5 attempts failed and no further retries are scheduled
        attempts:
          type: integer
          minimum: 0
        lastStatusCode:
          type: integer
          nullable: true
          description: HTTP status from the most recent attempt
        lastError:
          type: string
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - eventId
        - status
        - attempts
        - lastStatusCode
        - lastError
        - deliveredAt
        - nextRetryAt
        - createdAt
    WebhookEchoCapture:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers CaseXchange sent to the echo endpoint
        body:
          type: object
          additionalProperties: true
          description: Parsed JSON payload
        rawBody:
          type: string
          description: Exact bytes that were signed
        signatureValid:
          type: boolean
          description: >-
            Whether the `X-CaseXchange-Signature` CaseXchange sent verifies against the subscription secret. For 24
            hours after `rotate-secret` the previous secret is accepted here too, so a capture signed just before a
            rotation still reads as valid — outbound deliveries are signed with the current secret only.
        signatureDetails:
          type: object
          properties:
            received:
              type: string
              description: The X-CaseXchange-Signature header value
            timestamp:
              type: integer
              description: Unix timestamp (seconds) taken from the signature
            match:
              type: boolean
          required:
            - received
            - timestamp
            - match
        receivedAt:
          type: string
          format: date-time
      required:
        - id
        - subscriptionId
        - headers
        - body
        - rawBody
        - signatureValid
        - signatureDetails
        - receivedAt
    WebhookEchoEnableResult:
      type: object
      properties:
        echoUrl:
          type: string
          format: uri
          description: CaseXchange-hosted URL the subscription now delivers to
        echoToken:
          type: string
          description: >-
            Opaque token embedded in the echo URL. Treat it as a credential, not a label: the echo ingest accepts
            unauthenticated posts on it, so anyone holding it can flood your captures. It is returned here and nowhere
            else — no read endpoint discloses it.
      required:
        - echoUrl
        - echoToken
    WebhookEventType:
      type: string
      enum:
        - case.created
        - case.updated
        - case.deleted
        - referral.sent
        - referral.received
        - referral.accepted
        - referral.rejected
        - case.status_changed
        - note.created
        - note.updated
        - document.uploaded
        - document.deleted
        - case.rated
        - webhook.test
      description: >-
        CaseXchange firm-webhook event name, emitted to subscriptions owned by a firm-scoped (`cxp_*`) API key, plus the
        synthetic `webhook.test` event queued by the "send test event" action. Per-event payload shapes are documented
        separately.
    MedexWebhookEventType:
      type: string
      enum:
        - case.created
        - case.updated
        - case.archived
        - injury.created
        - injury.updated
        - injury.deleted
        - insurance.created
        - insurance.updated
        - insurance.deleted
        - appointment.created
        - appointment.updated
        - appointment.deleted
        - prescription.created
        - prescription.updated
        - prescription.deleted
        - diagnosis.created
        - diagnosis.updated
        - diagnosis.deleted
        - billing.created
        - billing.updated
        - billing.deleted
        - note.created
        - note.updated
        - note.deleted
        - document.uploaded
        - document.deleted
        - referral.sent
        - referral.under_review
        - referral.accepted
        - referral.in_treatment
        - referral.treatment_complete
        - referral.closed
        - referral.rejected
        - referral.withdrawn
        - webhook.test
      description: >-
        Med Xchange provider-webhook event name, emitted to subscriptions owned by a provider-scoped (`cxpp_*`) API key,
        plus the synthetic `webhook.test` event queued by the "send test event" action.
    CasexWebhookEnvelope:
      type: object
      description: >-
        The JSON body of every CaseXchange firm-webhook delivery. `data` varies by `event` — see the `x-webhook-events`
        catalog at the root of this document for the schema of each.
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
          description: Envelope version. A breaking change to the envelope increments this.
        event:
          type: string
          enum:
            - case.created
            - case.updated
            - case.deleted
            - referral.sent
            - referral.received
            - referral.accepted
            - referral.rejected
            - case.status_changed
            - note.created
            - note.updated
            - document.uploaded
            - document.deleted
            - case.rated
          description: Mirrors the `X-CaseXchange-Event` header.
        eventId:
          type: string
          format: uuid
          description: >-
            Mirrors `X-CaseXchange-Event-Id`. One fact gets one `eventId`, shared by the deliveries to both firms and by
            every subscription of the same firm. Correlate on it; deduplicate on `X-CaseXchange-Delivery`.
        occurredAt:
          type: string
          format: date-time
          description: >-
            When the underlying row was committed. Apply the delivery with the greatest `occurredAt`; when two status
            deliveries tie, chain them by `data.previousStatus` → `data.status`.
        perspective:
          type: string
          enum:
            - sent
            - received
          description: Which side of this referral your firm is on. Same vocabulary as CaseXchange notification directions.
        piiMasked:
          type: boolean
          description: >-
            True only for a receiving firm that has not yet acknowledged the referral. `data.case` is then the
            MaskedCaseSnapshot.
        recipientFirmId:
          type: string
          format: uuid
          description: The firm this delivery was built for — lets you detect a mis-routed delivery.
        referralId:
          type: string
          format: uuid
          description: The referral this event is about (the "hop"). Your firm may hold several per case.
        baseCaseId:
          type: string
          format: uuid
          description: The case behind the referral; stable across re-referrals.
        referenceNumber:
          type: string
          nullable: true
        referringFirm:
          type: object
          description: The sending firm on this hop.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        referentFirm:
          type: object
          description: The receiving firm on this hop; null on a DRAFT referral.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
          nullable: true
        isTestCase:
          type: boolean
          description: True for a test case. Filter on this in production.
        actor:
          type: object
          description: >-
            Who caused the change. Deliberately without a user id: the counterparty's user UUIDs are never exposed. Not
            a channel — CaseXchange does not distinguish a UI write from a public API write today, so to ignore your own
            echo, correlate against your own record.
          properties:
            firmId:
              type: string
              format: uuid
              nullable: true
              description: The firm that acted; null for platform administrators and system jobs.
            source:
              type: string
              enum:
                - manual
                - case_status
                - salesforce
                - smartadvocate
                - system
                - dearlegal
                - api
                - filemaker
                - clio
                - admin
                - ai
          required:
            - firmId
            - source
        data:
          type: object
          description: Event-specific body. See `x-webhook-events` for the schema keyed by `event`.
        changedFields:
          type: array
          items:
            type: string
          description: >-
            Present only on `case.updated` and `note.updated`. Already intersected with what YOUR firm is allowed to
            see. Every entry is a `data` property except the sentinel `customFields`, which is not a snapshot field and
            means "your custom field values changed — re-`GET` the case". A masked recipient never receives that
            sentinel.
      required:
        - schemaVersion
        - event
        - eventId
        - occurredAt
        - perspective
        - piiMasked
        - recipientFirmId
        - referralId
        - baseCaseId
        - referenceNumber
        - referringFirm
        - referentFirm
        - isTestCase
        - actor
        - data
    CaseSnapshot:
      type: object
      description: >-
        A referral as the emitter reread it after the commit. Same vocabulary as `GET /cases`, so a push and a poll
        agree field for field. Delivered to the sending firm, and to a receiving firm that has acknowledged receipt.
      properties:
        id:
          type: string
          format: uuid
          description: Referral UUID — the public API calls a referral a "case".
        baseCaseId:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
          example: ABC-0001
          description: >-
            System-generated case identifier. Rows created by CSV import may carry firm-supplied text instead: the
            importer does not validate the format, so do not parse it.
        status:
          type: string
          enum:
            - draft
            - sent
            - received
            - under_evaluation
            - investigating
            - signed
            - in_litigation
            - closing
            - won
            - lost
            - closed
            - rejected
            - withdrawn
            - pending_spin_off
          description: >-
            Normalized status: the legacy 'received' is published as 'under_evaluation', and the private
            'terminated'/'exhausted' categorizations are published as 'rejected'.
        closingStatus:
          type: string
          nullable: true
          enum:
            - won_settled
            - lost
            - no_longer_pursuing
          description: ClosingStatus enum value; null until the closing workflow starts.
        payoutType:
          type: string
          nullable: true
          enum:
            - lump_sum
            - structured
            - hybrid
            - other
          description: How settlement funds are distributed; null until set during closing.
        closureReason:
          type: string
          nullable: true
        referringFirmId:
          type: string
          format: uuid
          description: Sending firm
        referentFirmId:
          type: string
          format: uuid
          nullable: true
          description: Receiving firm; null on a DRAFT referral
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        caseType:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        county:
          type: string
          nullable: true
        clientFirstName:
          type: string
          nullable: true
        clientLastName:
          type: string
          nullable: true
        clientEmail:
          type: string
          format: email
          nullable: true
        clientPhone:
          type: string
          nullable: true
        clientDateOfBirth:
          type: string
          format: date
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        settlementAmount:
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Final settlement amount in dollars; null until recorded.
        attorneyFees:
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Total attorney fees in dollars; null until recorded.
        leadAttorneyName:
          type: string
          nullable: true
          description: Lead attorney at the receiving firm; null until set.
        warmTransferSuccessful:
          type: boolean
          description: Whether the warm transfer to the receiving firm succeeded.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Never masked here: the masked snapshot omits these fields
            entirely.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: >-
            Reason category for an unsuccessful warm transfer. Never masked here: the masked snapshot omits these fields
            entirely.
        clientFeeAgreementPercentage: *ref_5
        sendingFirmPercentage: *ref_12
        netFeeToSendingFirm:
          type: number
          nullable: true
          description: >-
            attorneyFees × the sendingFirmPercentage published on this record ÷ 100, rounded to cents. Null when either
            input is missing or zero.
        netFeeToHandlingFirm:
          type: number
          nullable: true
          description: attorneyFees − netFeeToSendingFirm. Null when netFeeToSendingFirm is null.
        resolutionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the outcome was recorded: the most recent transition into CLOSING, or into WON/LOST for legacy
            referrals that never passed through CLOSING.
        closedDate:
          type: string
          format: date-time
          nullable: true
          description: The most recent transition into CLOSED.
        projectedSettlementAmount:
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Projected settlement amount in dollars, set while the case is open; null until estimated.
        estimatedDateOfResolution:
          type: string
          format: date-time
          nullable: true
          description: Estimated resolution date; null until estimated.
        estimatedDistributionDate:
          type: string
          format: date-time
          nullable: true
          description: Estimated distribution date; null until estimated.
        statuteOfLimitationsExpiration:
          type: string
          format: date-time
          nullable: true
        phase:
          type: string
          nullable: true
        isRetainerSigned:
          type: boolean
        sentDate:
          type: string
          format: date-time
          nullable: true
          description: When the referral was sent (`referrals.sent_at`); null on a DRAFT.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - baseCaseId
        - referenceNumber
        - status
        - closingStatus
        - payoutType
        - closureReason
        - referringFirmId
        - referentFirmId
        - title
        - description
        - caseType
        - jurisdiction
        - county
        - clientFirstName
        - clientLastName
        - clientEmail
        - clientPhone
        - clientDateOfBirth
        - incidentDate
        - settlementAmount
        - attorneyFees
        - leadAttorneyName
        - warmTransferSuccessful
        - warmTransferUnsuccessfulReason
        - warmTransferUnsuccessfulReasonType
        - clientFeeAgreementPercentage
        - sendingFirmPercentage
        - netFeeToSendingFirm
        - netFeeToHandlingFirm
        - resolutionDate
        - closedDate
        - projectedSettlementAmount
        - estimatedDateOfResolution
        - estimatedDistributionDate
        - statuteOfLimitationsExpiration
        - phase
        - isRetainerSigned
        - sentDate
        - createdAt
        - updatedAt
    MaskedCaseSnapshot:
