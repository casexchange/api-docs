          type: string
          nullable: true
          description: >-
            First non-null case-management-system id linked to the referral, in priority order: DearLegal case id, Neos
            intake id, Clio matter id, SmartAdvocate case id, Salesforce intake record id.
        sendingFirmName:
          type: string
          nullable: true
        sendingFirmId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - draft
            - sent
            - received
            - under_evaluation
            - investigating
            - signed
            - in_litigation
            - closing
            - won
            - lost
            - closed
            - rejected
            - withdrawn
            - pending_spin_off
          description: The legacy 'received' value is reported as 'under_evaluation'.
        closingStatus:
          type: string
          enum:
            - won_settled
            - lost
            - no_longer_pursuing
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        receivingFirmId:
          type: string
          format: uuid
          nullable: true
        receivingFirmName:
          type: string
          nullable: true
        warmTransferSuccessful:
          type: boolean
          description: Whether the warm transfer to the receiving firm succeeded.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Masked (null) for the receiving firm while the referral is
            still SENT.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: >-
            Reason category for an unsuccessful warm transfer. Masked (null) for the receiving firm while the referral
            is still SENT.
      required:
        - id
        - referenceNumber
        - cmsId
        - sendingFirmName
        - sendingFirmId
        - status
        - closingStatus
        - createdAt
        - updatedAt
        - receivingFirmId
        - receivingFirmName
        - warmTransferSuccessful
        - warmTransferUnsuccessfulReason
        - warmTransferUnsuccessfulReasonType
    FeeProvenance:
      type: object
      description: >-
        Where the effective sending-firm fee percentage came from. `percentage` is the EFFECTIVE value —
        `sendingFirmPercentage` on the referral is the raw send-time stamp and stays null for un-stamped referrals. The
        sending firm's rule schedule itself is never exposed.
      properties:
        kind:
          type: string
          enum:
            - locked
            - estimated
            - pending
            - none
          description: >-
            locked = the referral's stamped send-time snapshot; estimated = read-time resolution against current
            agreements as of the sent date; pending = a resolved fee structure is awaiting outcome facts (see
            missingFacts); none = nothing stamped and nothing resolves.
        resolvedAsOf:
          type: string
          format: date
          nullable: true
          description: Platform date (YYYY-MM-DD) the resolution ran against; null when kind is 'locked'
        percentage:
          type: number
          nullable: true
          description: Effective whole-number percent (33.33 = 33.33%); null for pending/none
        coverageLapsed:
          type: boolean
          description: Present (true) when the matched agreement no longer covers the referral
        missingFacts:
          type: array
          items:
            type: string
            enum:
              - settlement_amount
              - cfa_percentage
              - litigation_phase
              - rate_structure
          description: "Present when kind is 'pending': the outcome facts needed to finalize the percentage"
      required:
        - kind
        - resolvedAsOf
        - percentage
    FeeRuleSnapshot:
      type: object
      description: >-
        Send-time snapshot of the fee rule that stamped sendingFirmPercentage. effectiveFrom / effectiveTo /
        resolvedAsOf are absent on snapshots written before 2026-08-11.
      properties:
        ruleId:
          type: string
          format: uuid
        caseTypeName:
          type: string
          nullable: true
        jurisdictionCode:
          type: string
          nullable: true
        percentage:
          type: number
          nullable: true
          description: Whole-number percent the rule stamped; null when the rule is structure-based
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        resolvedAsOf:
          type: string
          format: date
      required:
        - ruleId
        - caseTypeName
        - jurisdictionCode
        - percentage
