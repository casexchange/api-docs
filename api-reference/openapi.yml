paths:
  /referrals:
    get:
      operationId: listReferrals
      summary: List referrals
      description: >-
        Paginated list of referrals where the caller's firm is either the sending or receiving firm, newest first.
        Archived referrals are excluded. The status filter is symmetric across both directions because a referral's
        status is the truth both firms share.
      tags: &ref_15
        - Referrals
      security: &ref_16
        - apiKeyAuth: []
      x-access-tier: read_only
      parameters:
        - &ref_30
          in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - &ref_31
          in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Results per page (max 100)
        - &ref_32
          in: query
          name: status
          schema:
            type: string
            enum:
              - draft
              - sent
              - received
              - under_evaluation
              - investigating
              - signed
              - in_litigation
              - closing
              - won
              - lost
              - closed
              - rejected
              - withdrawn
              - pending_spin_off
          description: >-
            Filter by CaseStatus. 'terminated' and 'exhausted' are rejected with 400: they are the sending firm's
            private categorization of a rejected referral, not referral statuses.
      responses:
        "200":
          description: Paginated list of referrals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Referral"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  meta: *ref_12
                required:
                  - data
                  - pagination
                  - meta
        "400": &ref_17
          description: Request validation failed
          content: &ref_14
            application/json:
              schema: *ref_13
        "401": &ref_18
          description: Invalid or missing API key
          content: *ref_14
        "403": &ref_19
          description: API key tier does not permit this action
          content: *ref_14
  /referrals/match:
    post:
      operationId: matchReferrals
      summary: Find referrals by client identifiers
      description: >-
        Searches the caller's firm's referrals for clients matching the supplied identifiers and returns ranked
        candidates with a confidence score and the fields that matched. At least one identifier is required. Requires
