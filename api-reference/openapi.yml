      summary: Create a webhook subscription
      description: >-
        Registers an HTTPS endpoint to receive events. The response includes the signing `secret` — this is the only
        time it is returned (apart from a later rotate-secret call), so store it immediately. The new subscription is
        owned by whichever kind of key created it (a firm or a Med Xchange provider) — see the Webhooks tag.


        Requires a firm-scoped (`cxp_*`) or provider-scoped (`cxpp_*`) API key at STANDARD tier or above.
      tags:
        - Webhooks
      security: *ref_21
      x-access-tier: standard
      x-key-scope: &ref_39
        - firm
        - provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: >-
                    Delivery endpoint. Must use `https://` on port 443, carry no embedded credentials, and resolve to a
                    public IP address.
                description:
                  type: string
                  maxLength: 255
      responses:
        "201":
          description: Created subscription including its secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WebhookSubscriptionWithSecret"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "400":
          description: >-
            Request validation failed, the URL failed the HTTPS/reachability check (`invalid_webhook_url`), or the owner
            already has 5 active subscriptions (`subscription_limit_reached`)
          content: *ref_19
        "401": *ref_23
        "403": &ref_41
          description: >-
            Either the key's tier is below `standard` (`insufficient_tier`), or the key cannot manage webhooks: an admin
            key, a Salesforce `cxsf_*` token, or an MCP-issued key (`wrong_scope`)
          content: *ref_19
    get:
      operationId: listWebhooks
      summary: List webhook subscriptions
      description: >-
        Returns the calling key's own webhook subscriptions, paginated — including ones that are deactivated (`isActive:
        false`, whether you switched them off or the circuit breaker did); only deleted subscriptions are excluded. A
        subscription in echo mode reports your own endpoint in `url` and `isEchoActive: true`. Requires a firm-scoped
        (`cxp_*`) or provider-scoped (`cxpp_*`) API key.
      tags:
        - Webhooks
      security: *ref_21
      x-access-tier: read_only
      x-key-scope: *ref_39
      parameters:
        - *ref_34
        - *ref_35
      responses:
        "200":
          description: Paginated subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookSubscription"
