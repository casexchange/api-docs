  /salesforce/interactive-sends:
    post:
      operationId: createSalesforceInteractiveSend
      summary: Send a Salesforce record to CaseXchange as a new case or re-referral
      description: >-
        Turns an org-side "send this record to CaseXchange" submit into a durable, idempotent CaseXchange case creation
        (or re-referral to a new firm) — spec §7.2. Reads the source record from Salesforce using the firm's active,
        activated, interactive-send-enabled v2 sending profile, applies its confirmed prefill links plus any
        `overrides`, and creates (or re-refers) a case.


        Idempotency: pass a fresh `idempotencyKey` (UUID) on every distinct submit. Replaying the same key returns the
        original outcome with `200` and `attempt.replay: true` instead of creating a duplicate case; a genuinely new
        submit must use a new key.


        Observing write-back: there is NO status-check endpoint. Once this call returns, the CaseXchange case exists,
        but its bridge fields (match key, status, reference number, deep link) are stamped back onto the source
        Salesforce record asynchronously by the write-back job — observe completion by reading those fields on the
        source record (typically within ~5 minutes). A send that exhausts its write-back retries moves to
        `needs_attention` and is paused for an admin; that state sends NO signal to the org side, so clients should
        surface a send whose fields remain unstamped after a timeout as stale rather than wait indefinitely.


        Error codes (409s carry a per-code `error.details` object — see the 409 response):

        - `400 match_key_missing` — the resolved sending profile has no match key configured at all (send is not
        supported); an external-ID or lookup match key is required.

        - `400 validation_error` — the built create payload failed validation; `error.details.errors` carries the
        field-level issues.

        - `400 bad_request` — a re-refer business-rule rejection propagated from the re-referral service (e.g. the case
        is not in a re-referable status, or no prior referral exists); the message is descriptive.

        - `404 send_mapping_not_configured` — no active, activated, interactive-send-enabled v2 sending profile matches
        the given object/record type (exact record-type match, falling back to the "Any record type" profile).

        - `404 source_record_not_found` — sourceRecordId does not exist (or is not visible) in Salesforce.

        - `404 linked_case_not_found` — reRefer was requested but no linked CaseXchange case exists for this record (or
        it no longer exists).

        - `409 record_already_sent` — the record is already linked to a CaseXchange case and reRefer was not requested.
        `error.details`: `{ baseCaseId, referenceNumber }` (the existing case, so the client can offer re-refer).

        - `409 record_already_linked` — the record already carries a match-key value from a prior send with no active
        link. `error.details`: `{ matchKeyValue }`.

        - `409 send_in_progress` — a send for this record (or idempotency key) is already in flight. `error.details`: `{
        retryAfterMs }` — the remaining in-flight window (floored at 0) to back off before retrying.

        - `409 attempt_failed` — a previous send with this idempotency key failed; submit a fresh key to retry.
        `error.details`: `{ failureCode, lastError }`.

        - `502 salesforce_unavailable` — no usable Salesforce access token for this connection.

        - `502 salesforce_read_failed` — the Salesforce SOQL read of the source record failed.


        Requires FULL tier.
      tags:
        - Salesforce
      security: *ref_16
      x-access-tier: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceRecordId
                - sfObjectApiName
                - targetFirmIds
                - idempotencyKey
              properties:
                sourceRecordId:
                  type: string
                  pattern: ^[a-zA-Z0-9]{15,18}$
                  description: Salesforce record Id (15 or 18 char) of the source record being sent.
                sfObjectApiName:
                  type: string
                  description: Salesforce object API name, e.g. litify_pm__Matter__c.
                sfRecordTypeDevName:
                  type: string
                  nullable: true
                  description: Record type developer name. Omit or null to match profiles with no record type set.
                targetFirmIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 1
                  description: >-
                    Receiving firm id(s) for this send. Array-shaped for forward compatibility, but CaseXchange supports
                    exactly one active referral per case — exactly one target firm per send today.
                overrides:
                  type: object
                  additionalProperties:
                    nullable: true
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                  default: {}
                  description: >-
                    Optional per-field overrides keyed by casex.* canonical key. Keys must be one of the
                    interactive-send form fields returned by GET /salesforce/send-mapping (sendFields).
                idempotencyKey:
                  type: string
                  format: uuid
                  description: >-
                    A fresh UUID generated by the caller for each distinct submit. Replaying the same key returns the
                    original outcome (200, attempt.replay: true) instead of creating a duplicate case.
                mappingVersion:
                  type: string
                  maxLength: 64
                  description: >-
                    Observability only, echoed from GET /salesforce/send-mapping. A stale/mismatched value is logged but
                    never rejected — the server always re-reads current mapping config.
                reRefer:
                  type: boolean
                  default: false
                  description: >-
                    When true and the source record is already linked to a CaseXchange case, re-refer that case to
                    targetFirmIds instead of creating a new case.
                notes:
                  type: string
                  maxLength: 10000
                routingRuleId:
                  type: string
                  format: uuid
                  description: >-
                    Optional. Routing rule this send was chosen from (from GET /routing/evaluate). Ignored (with a
                    server-side warning) if it is not a live rule owned by your firm.
                roundRobinPosition:
                  type: integer
                  minimum: 0
                  description: >-
                    Optional. The roundRobinPosition from GET /routing/evaluate. Requires routingRuleId; advances the
                    rule's round-robin pointer.
      responses:
        "200":
          description: Replay of a previously processed idempotency key — returns the original outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractiveSendResult"
                  meta: *ref_12
                required:
                  - data
                  - meta
        "201":
          description: New case created (or re-referred) from the source record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractiveSendResult"
                  meta: *ref_12
                required:
                  - data
                  - meta
        "400": *ref_17
        "401": *ref_18
        "403": *ref_19
        "404": *ref_21
        "409":
          description: >-
            Conflict — the `error.code` selects one of four cases, each with a distinct `error.details` shape:

            - `record_already_sent` (already linked; pass reRefer to re-refer instead) — `details: { baseCaseId,
            referenceNumber }`.

            - `record_already_linked` (claimed by a prior send with no active link) — `details: { matchKeyValue }`.

            - `send_in_progress` (a send for this record/key is already in flight) — `details: { retryAfterMs }`, the
            remaining in-flight window in ms (floored at 0).

            - `attempt_failed` (the prior attempt for this idempotency key failed; use a fresh key) — `details: {
            failureCode, lastError }`.
          content: *ref_14
