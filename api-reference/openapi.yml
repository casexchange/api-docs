          type: integer
          description: >-
            Opaque echo token — pass this back unchanged as roundRobinPosition (with rule.id as routingRuleId) into POST
            /sent-cases or POST /sent-cases/{id}/refer to advance the rule's round-robin pointer server-side. It is NOT
            an index into the assignments array returned here; to find the rotation's pick, use assignments[0] or match
            selectedFirmId.
        assignments:
          type: array
          description: >-
            The matched rule's active assignments that are eligible for this attempt (inside their attempt window and,
            for /routing/re-refer, not a firm that already holds the case), ordered starting at the round-robin
            selection (then the rest of the configured order, wrapping). assignments[0] is always the rotation's pick —
            the same firm as selectedFirmId when the pick is a CaseXchange firm. When the pick is an external-contact
            assignment, assignments[0].firmId (and selectedFirmId) are null — callers that send to assignments[0] must
            treat a null firmId as "no auto-routable firm" and fall back to manual selection. The order changes between
            calls as the pointer advances; do not rely on positional stability except that index 0 is the current pick.
