openapi: 3.0.3
info:
  title: CaseXchange Public API
  version: 1.0.0
  description: |-
    The CaseXchange Public API enables law firms to integrate referral management
    directly into their own systems.

    ## Authentication
    All requests must include an `X-API-Key` header containing a valid API key
    (format: `cxp_<hex>`). Keys are scoped to a firm and an access tier.

    ## Access Tiers
    | Tier | Description |
    |------|-------------|
    | `read_only` | GET endpoints — read data without mutation |
    | `standard` | read_only + create/update case referrals |
    | `full` | standard + delete, routing rules, bulk import, firm mutation |

    ## Rate Limiting
    Rate limits are enforced per API key. Exceeded limits return `429 Too Many Requests`.

    ## Pagination
    List endpoints accept `page` (default 1) and `limit` (default 20, max 100) query params.

    ## Response Format
    Successful responses are wrapped in `{ data: T, meta: { requestId, timestamp } }`.
    Errors are wrapped in `{ error: { code, message }, meta: { requestId, timestamp } }`.
  contact:
    name: CaseXchange API Support
    url: https://casexchange.com
servers:
  - url: https://api.casexchange.com/api/public/v1
    description: Production Public API base path
  - url: /api/public/v1
    description: Relative base path (for proxied docs/local environments)
tags:
  - name: Reference Data
    description: Case types, jurisdictions, and counties
  - name: Firms
    description: Firm directory and profile management
  - name: Cases
    description: Case referral lifecycle and actions
  - name: Sent Cases
    description: "Sender-side case management: create, track, and refer/route cases you own"
  - name: Documents
    description: Document upload, download, and management
  - name: Users
    description: User management within the caller's firm
  - name: Routing
    description: Referral routing rules
  - name: Analytics
    description: Dashboard and case analytics
  - name: Notifications
    description: Notification preferences and email management
  - name: Med Cases
    description: Med Xchange cases and their nested referrals to medical providers
  - name: MedEx Documents
    description: Med Xchange case document listing and download
  - name: Import
    description: Bulk case import/update via CSV
  - name: Salesforce
    description: Org-facing endpoints consumed by the CaseXchange managed package
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Public API key (starts with cxp_). Required on every request.
  schemas:
    Firm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        isInternal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          example: ABC-0001
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          description: CaseStatus enum value
        caseType:
          type: string
        jurisdiction:
          type: string
        county:
          type: string
          nullable: true
        clientFirstName:
          type: string
        clientLastName:
          type: string
        clientEmail:
          type: string
          format: email
          nullable: true
        clientPhone:
          type: string
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        sendingFirmId:
          type: string
          format: uuid
        receivingFirmId:
          type: string
          format: uuid
          nullable: true
        warmTransferSuccessful:
          type: boolean
          description: Whether the warm transfer to the receiving firm succeeded.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Null until the referral is acknowledged (PII masking) when
            viewed by the receiving firm.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: >-
            Reason category for an unsuccessful warm transfer. Null until the referral is acknowledged (PII masking)
            when viewed by the receiving firm.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time
    MedCaseDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Document handle (MedCaseDocument junction id)
        fileName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
          description: Raw byte size
        category:
          type: string
        source:
          type: string
          enum:
            - upload
            - litify_sync
            - premier_sync
        uploadedAt:
          type: string
          format: date-time
        pending:
          type: boolean
          description: If true, bytes are not yet materialized; first fetch may be slower.
        sharedWithProviders:
          type: boolean
          description: >-
            Whether providers on the case can currently see this document. Provider-scoped keys never receive hidden
            documents, so this is always true for them; firm-scoped keys see hidden documents flagged false.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          description: UserRole enum value
        isActive:
          type: boolean
        firmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    RoutingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        conditions:
          type: array
          items:
            type: object
        targetFirmId:
          type: string
          format: uuid
        priority:
          type: integer
        isActive:
          type: boolean
        firmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SentCase:
      type: object
      description: A case from the sender (owning firm) perspective, with all of its referrals.
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
          example: ABC-0001
        salesforceId:
          type: string
          nullable: true
        salesforceObjectType:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        caseType:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        county:
          type: string
          nullable: true
        clientFirstName:
          type: string
          nullable: true
        clientLastName:
          type: string
          nullable: true
        clientEmail:
          type: string
          format: email
          nullable: true
        clientPhone:
          type: string
          nullable: true
        clientDateOfBirth:
          type: string
          format: date
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        tier:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: >-
            Sender-assigned case rating (1 = highest priority, 5 = lowest). Distinct from the API key access tier. Null
            when unrated.
        ratedTier:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Reserved for a future rating workflow; not currently populated.
        ratingNotes:
          type: string
          nullable: true
          description: Reserved for a future rating workflow; not currently populated.
        source:
          type: string
          nullable: true
        status:
          type: string
          description: CaseStatus enum value
        closingStatus:
          type: string
          nullable: true
        warmTransferSuccessful:
          type: boolean
          description: >-
            Whether the sending firm's warm transfer to the receiving firm succeeded. Sourced from the most-recent
            referral.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Unmasked here — this is the sending firm's own data.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: Reason category for an unsuccessful warm transfer.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        referrals:
          type: array
          description: All referrals on this case, most recent first.
          items:
            type: object
    SentCaseListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
        salesforceId:
          type: string
          nullable: true
        receivingFirmName:
          type: string
          nullable: true
        receivingFirmId:
          type: string
          format: uuid
          nullable: true
        owningFirmId:
          type: string
          format: uuid
          nullable: true
        owningFirmName:
          type: string
          nullable: true
        status:
          type: string
          description: CaseStatus enum value
        closingStatus:
          type: string
          nullable: true
        tier:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: >-
            Sender-assigned case rating (1 = highest priority, 5 = lowest). Distinct from the API key access tier. Null
            when unrated.
        warmTransferSuccessful:
          type: boolean
          description: >-
            Whether the sending firm's warm transfer to the receiving firm succeeded. Sourced from the most-recent
            referral.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Unmasked here — this is the sending firm's own data.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: Reason category for an unsuccessful warm transfer.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoutingEvaluation:
      type: object
      nullable: true
      description: The routing decision for a case profile, or null when no active rule matches.
      properties:
        rule:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        selectedFirmId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The firm the round-robin pointer currently selects — send here. Null when the pick is an external-contact
            assignment (no CaseXchange firm).
        roundRobinPosition:
          type: integer
          description: >-
            Opaque echo token — pass this back unchanged as roundRobinPosition (with rule.id as routingRuleId) into POST
            /sent-cases or POST /sent-cases/{id}/refer to advance the rule's round-robin pointer server-side. It is NOT
            an index into the assignments array returned here; to find the rotation's pick, use assignments[0] or match
            selectedFirmId.
        assignments:
          type: array
          description: >-
            All active assignments for the matched rule, ordered starting at the round-robin selection (then the rest of
            the configured order, wrapping). assignments[0] is always the rotation's pick — the same firm as
            selectedFirmId when the pick is a CaseXchange firm. When the pick is an external-contact assignment,
            assignments[0].firmId (and selectedFirmId) are null — callers that send to assignments[0] must treat a null
            firmId as "no auto-routable firm" and fall back to manual selection. The order changes between calls as the
            pointer advances; do not rely on positional stability except that index 0 is the current pick.
          items:
            type: object
            properties:
              firmId:
                type: string
                format: uuid
                nullable: true
              firmName:
                type: string
                nullable: true
              referralInstructions:
                type: string
                nullable: true
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    MedCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
        patientFirstName:
          type: string
          nullable: true
        patientLastName:
          type: string
          nullable: true
        patientEmail:
          type: string
          format: email
          nullable: true
        patientPhone:
          type: string
          nullable: true
        patientDateOfBirth:
          type: string
          format: date
          nullable: true
        patientZipCode:
          type: string
          nullable: true
        handlingFirmId:
          type: string
          format: uuid
          nullable: true
        attorneyName:
          type: string
          nullable: true
        attorneyPhone:
          type: string
          nullable: true
        attorneyEmail:
          type: string
          format: email
          nullable: true
        description:
          type: string
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        caseType:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        createdByFirmId:
          type: string
          format: uuid
          nullable: true
        createdByProviderId:
          type: string
          format: uuid
          nullable: true
        baseCaseId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedCaseCreateRequest:
      type: object
      description: All fields are optional. Provide at minimum patientFirstName and/or patientLastName.
      properties:
        patientFirstName:
          type: string
          maxLength: 255
        patientLastName:
          type: string
          maxLength: 255
        patientEmail:
          type: string
          format: email
          maxLength: 255
        patientPhone:
          type: string
          maxLength: 30
          description: Digits only
        patientDateOfBirth:
          type: string
          format: date
        patientZipCode:
          type: string
          maxLength: 20
        attorneyName:
          type: string
          maxLength: 255
        attorneyPhone:
          type: string
          maxLength: 30
          description: Digits only
        attorneyEmail:
          type: string
          format: email
          maxLength: 255
        description:
          type: string
        incidentDate:
          type: string
          format: date
        caseType:
          type: string
          maxLength: 255
        jurisdiction:
          type: string
          maxLength: 255
    MedCaseUpdateRequest:
      type: object
      description: >-
        Provide at least one field. Only provided fields are updated. Pass `baseCaseId: null` to unlink a previously
        linked CaseXchange case.
      minProperties: 1
      properties:
        patientFirstName:
          type: string
          maxLength: 255
        patientLastName:
          type: string
          maxLength: 255
        patientEmail:
          type: string
          format: email
          maxLength: 255
        patientPhone:
          type: string
          maxLength: 30
          description: Digits only
        patientDateOfBirth:
          type: string
          format: date
        patientZipCode:
          type: string
          maxLength: 20
        attorneyName:
          type: string
          maxLength: 255
        attorneyPhone:
          type: string
          maxLength: 30
          description: Digits only
        attorneyEmail:
          type: string
          format: email
          maxLength: 255
        description:
          type: string
        incidentDate:
          type: string
          format: date
        caseType:
          type: string
          maxLength: 255
        jurisdiction:
          type: string
          maxLength: 255
        baseCaseId:
          type: string
          format: uuid
          nullable: true
    MedReferral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
        medCaseId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
          nullable: true
        doctorIds:
          type: array
          items:
            type: string
            format: uuid
          description: Doctor roster (user ids) assigned to the referral.
        locationIds:
          type: array
          items:
            type: string
            format: uuid
          description: Location roster (provider location ids) assigned to the referral.
        parentReferralId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          description: MedicalReferralStatus enum value
          enum:
            - draft
            - sent
            - under_review
            - accepted
            - in_treatment
            - treatment_complete
            - closed
            - rejected
            - withdrawn
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedReferralCreateRequest:
      type: object
      required:
        - providerId
      description: >-
        Creates a new referral on the med case. The provider must be in your network (an ACTIVE FirmProviderConnection);
        otherwise the request returns 403.
      properties:
        providerId:
          type: string
          format: uuid
          description: UUID of the provider to refer to (required). Must be in your network.
        doctorIds:
          type: array
          items:
            type: string
            format: uuid
          description: Doctor roster (user ids) to assign to the referral.
        locationIds:
          type: array
          items:
            type: string
            format: uuid
          description: Location roster (provider location ids) to assign to the referral.
        notes:
          type: string
    MedReferralUpdateRequest:
      type: object
      description: >-
        Provide at least one field. Only provided fields are updated. Doctor/location assignment is not writable via
        this endpoint.
      minProperties: 1
      properties:
        providerId:
          type: string
          format: uuid
        notes:
          type: string
    MedInsurance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        medCaseId:
          type: string
          format: uuid
        insuranceCarrier:
          type: string
          nullable: true
        insuranceAddress:
          type: string
          nullable: true
        insurancePhone:
          type: string
          nullable: true
        policyNumber:
          type: string
          nullable: true
        claimNumber:
          type: string
          nullable: true
        adjusterName:
          type: string
          nullable: true
        adjusterPhone:
          type: string
          nullable: true
        adjusterEmail:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        insuranceType:
          type: string
          enum:
            - health
            - auto
            - workers_comp
            - liability
            - other
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SendMapping:
      type: object
      description: >-
        The active v2 sending profile's mapping for one (sfObjectApiName, sfRecordTypeDevName) pair, consumed by the
        managed package's send LWC (spec §6).
      properties:
        profile:
          type: object
          properties:
            id:
              type: string
              format: uuid
            sfObjectApiName:
              type: string
            sfRecordTypeDevName:
              type: string
              nullable: true
            version:
              type: string
              format: date-time
              description: Observability marker only — the send endpoint re-reads current config server-side.
          required:
            - id
            - sfObjectApiName
            - sfRecordTypeDevName
            - version
        matchKey:
          type: object
          nullable: true
          description: >-
            Discriminated union: {mode:'externalId', fieldName} or {mode:'lookup', lookupField, relatedExternalIdField?,
            useRecordId?} — a lookup match key requires relatedExternalIdField, useRecordId, or both (matching by the
            related record's external-ID field, its Salesforce record ID via CX sync links, or falling back from one to
            the other).
          properties:
            mode:
              type: string
              enum:
                - externalId
                - lookup
            fieldName:
              type: string
            lookupField:
              type: string
            relatedExternalIdField:
              type: string
              description: Optional on a lookup match key when useRecordId is set — one of the two bases is required.
            useRecordId:
              type: boolean
              description: >-
                Match the lookup's related record by its Salesforce record ID (via CX sync links). Optional when
                relatedExternalIdField is set.
        prefill:
          type: array
          items: &ref_0
            type: object
            properties:
              canonicalKey:
                type: string
                example: matter.status
              sfFieldApiName:
                type: string
                example: litify_pm__Matter_Status__c
            required:
              - canonicalKey
              - sfFieldApiName
          description: Fields to prefill on the send form from CaseXchange (toCx / bidirectional links).
        writeback:
          type: array
          items: *ref_0
          description: Fields the org expects written back after send (toSf / bidirectional links).
        sendFields:
          type: array
          items:
            type: object
            properties:
              canonicalKey:
                type: string
              payloadKey:
                type: string
              label:
                type: string
              type:
                type: string
              required:
                type: boolean
              editable:
                type: boolean
              prefillSfFieldApiName:
                type: string
                nullable: true
            required:
              - canonicalKey
              - payloadKey
              - label
              - type
              - required
              - editable
              - prefillSfFieldApiName
          description: The full send-field catalog with prefill values resolved where available.
        resolvers:
          type: object
          description: >-
            Connection-scoped translation tables so the send LWC can resolve prefill values client-side, without a
            second round trip.
          properties:
            valueMaps:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: string
              description: SF→CX translation entries, keyed by the EXACT sfFieldApiName served in prefill[].
            caseTypeMap:
              type: object
              additionalProperties:
                type: string
              description: CX case-type slug by 15-char-normalized SF record Id (active entries; primary wins).
          required:
            - valueMaps
            - caseTypeMap
      required:
        - profile
        - matchKey
        - prefill
        - writeback
        - sendFields
        - resolvers
    InteractiveSendResult:
      type: object
      description: >-
        Result of a durable, idempotent interactive send/re-refer (spec §7.2). `attempt.state` tells the org client
        where write-back stands: 'writeback_pending' means the bridge fields will be stamped by the writeback job;
        'completed' means they already have been. 'superseded' (terminal, returned on replay) means a later re-refer
        superseded this attempt's referral, so nothing is left to stamp. There is no status-check endpoint: the only
        signal that write-back finished is the bridge fields appearing on the source Salesforce record (typically within
        ~5 minutes). A send that exhausts its retries becomes 'needs_attention' and is paused for an admin WITHOUT
        signalling the org, so clients should treat a still-unstamped record after a timeout as stale rather than poll
        indefinitely.
      properties:
        attempt:
          type: object
          properties:
            id:
              type: string
              format: uuid
            state:
              type: string
              enum:
                - processing
                - writeback_pending
                - completed
                - needs_attention
                - superseded
                - failed
              description: Attempt lifecycle state.
            idempotencyKey:
              type: string
              format: uuid
            replay:
              type: boolean
              description: >-
                True when this response replays a previously processed idempotency key (a genuine retry of the same
                submit) rather than a freshly created send.
          required:
            - id
            - state
            - idempotencyKey
            - replay
        sentCase:
          $ref: "#/components/schemas/SentCase"
      required:
        - attempt
        - sentCase
    WarmTransferAnalytics:
      type: object
      description: >-
        Warm-transfer outcome metrics. A referral counts as an "attempt" when it was marked successful or has an
        unsuccessful reason recorded (typed or free text); referrals with no warm-transfer outcome recorded are excluded
        from every aggregate.
      properties:
        kpis:
          type: object
          properties:
            attempted:
              type: integer
            successful:
              type: integer
            successRate: &ref_1
              type: integer
              nullable: true
              description: Rounded percentage (0–100); null when attempted is 0.
        reasonBreakdown:
          type: array
          description: >-
            Unsuccessful warm transfers grouped by structured reason category (free-text reasons are never aggregated).
            Untyped rows with free text are bucketed as OTHER.
          items:
            type: object
            properties:
              reasonType:
                type: string
                enum:
                  - FIRM_UNABLE_TO_ANSWER
                  - CLIENT_UNABLE_TO_CONTINUE
                  - OTHER
              count:
                type: integer
        byPartnerFirm:
          type: array
          description: Top 10 partner firms by attempts — receiving firms on /analytics/sent, sending firms on /analytics/received.
          items:
            type: object
            properties:
              firmId:
                type: string
                format: uuid
                nullable: true
              firmName:
                type: string
              attempted:
                type: integer
              successful:
                type: integer
              successRate: *ref_1
        trend:
          type: array
          description: Monthly buckets (only months with data), ascending, bucketed on sent date.
          items:
            type: object
            properties:
              month:
                type: string
                example: 2026-08
                description: YYYY-MM in the requested timezone
              attempted:
                type: integer
              successful:
                type: integer
              successRate: *ref_1
    Error: &ref_3
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        meta: &ref_2
          type: object
          properties:
            requestId:
              type: string
              example: req_f2dbe1d3f6ad4a7bb5b4c9f2
            timestamp:
              type: string
              format: date-time
          required:
            - requestId
            - timestamp
      required:
        - error
        - meta
