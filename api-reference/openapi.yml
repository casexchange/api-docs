openapi: 3.0.3
info:
  title: CaseXchange Public API
  version: 1.0.0
  description: |-
    The CaseXchange Public API enables law firms to integrate referral management
    directly into their own systems.

    ## Authentication
    All requests must include an `X-API-Key` header containing a valid API key
    (format: `cxp_<hex>`). Keys are scoped to a firm and an access tier.

    ## Access Tiers
    | Tier | Description |
    |------|-------------|
    | `read_only` | GET endpoints — read data without mutation |
    | `standard` | read_only + create/update case referrals |
    | `full` | standard + delete, close, routing rules, bulk import, firm mutation |

    ## Rate Limiting
    Rate limits are enforced per API key. Exceeded limits return `429 Too Many Requests`.

    ## Pagination
    List endpoints accept `page` (default 1) and `limit` (default 20, max 100) query params.

    ## Response Format
    Successful responses are wrapped in `{ data: T, meta: { requestId, timestamp } }`.
    Errors are wrapped in `{ error: { code, message }, meta: { requestId, timestamp } }`.
  contact:
    name: CaseXchange API Support
    url: https://casexchange.com
servers:
  - url: /api/public/v1
    description: Public API base path
tags:
  - name: Reference Data
    description: Case types, jurisdictions, and counties
  - name: Firms
    description: Firm directory and profile management
  - name: Cases
    description: Case referral lifecycle and actions
  - name: Documents
    description: Document upload, download, and management
  - name: Users
    description: User management within the caller's firm
  - name: Routing
    description: Referral routing rules
  - name: Analytics
    description: Dashboard and case analytics
  - name: Notifications
    description: Notification preferences and email management
  - name: Med Cases
    description: Med Xchange cases and their nested referrals to medical providers
  - name: Import
    description: Bulk case import/update via CSV
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Public API key (starts with cxp_). Required on every request.
  schemas:
    Firm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        isInternal:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaseType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    Case:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          example: ABC-0001
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          description: CaseStatus enum value
        caseType:
          type: string
        jurisdiction:
          type: string
        county:
          type: string
          nullable: true
        clientFirstName:
          type: string
        clientLastName:
          type: string
        clientEmail:
          type: string
          format: email
          nullable: true
        clientPhone:
          type: string
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        sendingFirmId:
          type: string
          format: uuid
        receivingFirmId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          description: UserRole enum value
        isActive:
          type: boolean
        firmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    RoutingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        conditions:
          type: array
          items:
            type: object
        targetFirmId:
          type: string
          format: uuid
        priority:
          type: integer
        isActive:
          type: boolean
        firmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    MedCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
        patientFirstName:
          type: string
          nullable: true
        patientLastName:
          type: string
          nullable: true
        patientEmail:
          type: string
          format: email
          nullable: true
        patientPhone:
          type: string
          nullable: true
        patientDateOfBirth:
          type: string
          format: date
          nullable: true
        patientZipCode:
          type: string
          nullable: true
        handlingFirmId:
          type: string
          format: uuid
          nullable: true
        attorneyName:
          type: string
          nullable: true
        attorneyPhone:
          type: string
          nullable: true
        attorneyEmail:
          type: string
          format: email
          nullable: true
        description:
          type: string
          nullable: true
        incidentDate:
          type: string
          format: date
          nullable: true
        caseType:
          type: string
          nullable: true
        jurisdiction:
          type: string
          nullable: true
        createdByFirmId:
          type: string
          format: uuid
          nullable: true
        createdByProviderId:
          type: string
          format: uuid
          nullable: true
        baseCaseId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedCaseCreateRequest:
      type: object
      description: All fields are optional. Provide at minimum patientFirstName and/or patientLastName.
      properties:
        patientFirstName:
          type: string
          maxLength: 255
        patientLastName:
          type: string
          maxLength: 255
        patientEmail:
          type: string
          format: email
          maxLength: 255
        patientPhone:
          type: string
          maxLength: 30
          description: Digits only
        patientDateOfBirth:
          type: string
          format: date
        patientZipCode:
          type: string
          maxLength: 20
        attorneyName:
          type: string
          maxLength: 255
        attorneyPhone:
          type: string
          maxLength: 30
          description: Digits only
        attorneyEmail:
          type: string
          format: email
          maxLength: 255
        description:
          type: string
        incidentDate:
          type: string
          format: date
        caseType:
          type: string
          maxLength: 255
        jurisdiction:
          type: string
          maxLength: 255
    MedCaseUpdateRequest:
      type: object
      description: >-
        Provide at least one field. Only provided fields are updated. Pass `baseCaseId: null` to unlink a previously
        linked CaseXchange case.
      minProperties: 1
      properties:
        patientFirstName:
          type: string
          maxLength: 255
        patientLastName:
          type: string
          maxLength: 255
        patientEmail:
          type: string
          format: email
          maxLength: 255
        patientPhone:
          type: string
          maxLength: 30
          description: Digits only
        patientDateOfBirth:
          type: string
          format: date
        patientZipCode:
          type: string
          maxLength: 20
        attorneyName:
          type: string
          maxLength: 255
        attorneyPhone:
          type: string
          maxLength: 30
          description: Digits only
        attorneyEmail:
          type: string
          format: email
          maxLength: 255
        description:
          type: string
        incidentDate:
          type: string
          format: date
        caseType:
          type: string
          maxLength: 255
        jurisdiction:
          type: string
          maxLength: 255
        baseCaseId:
          type: string
          format: uuid
          nullable: true
    MedReferral:
      type: object
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
        medCaseId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
          nullable: true
        providerLocationId:
          type: string
          format: uuid
          nullable: true
        doctorId:
          type: string
          format: uuid
          nullable: true
        parentReferralId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          description: MedicalReferralStatus enum value
          enum:
            - draft
            - sent
            - under_review
            - accepted
            - in_treatment
            - treatment_complete
            - closed
            - rejected
            - withdrawn
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MedReferralCreateRequest:
      type: object
      required:
        - providerId
      description: >-
        Creates a new referral on the med case. The provider must be in your network (an ACTIVE FirmProviderConnection);
        otherwise the request returns 403.
      properties:
        providerId:
          type: string
          format: uuid
          description: UUID of the provider to refer to (required). Must be in your network.
        providerLocationId:
          type: string
          format: uuid
          nullable: true
        doctorId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
    MedReferralUpdateRequest:
      type: object
      description: Provide at least one field. Only provided fields are updated.
      minProperties: 1
      properties:
        providerId:
          type: string
          format: uuid
        providerLocationId:
          type: string
          format: uuid
          nullable: true
        doctorId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
    MedInsurance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        medCaseId:
          type: string
          format: uuid
        insuranceCarrier:
          type: string
          nullable: true
        insuranceAddress:
          type: string
          nullable: true
        insurancePhone:
          type: string
          nullable: true
        policyNumber:
          type: string
          nullable: true
        claimNumber:
          type: string
          nullable: true
        adjusterName:
          type: string
          nullable: true
        adjusterPhone:
          type: string
          nullable: true
        adjusterEmail:
          type: string
          nullable: true
        isPrimary:
          type: boolean
        insuranceType:
          type: string
          enum:
            - health
            - auto
            - workers_comp
            - liability
            - other
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error: &ref_1
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
        meta: &ref_0
          type: object
          properties:
            requestId:
              type: string
              example: req_f2dbe1d3f6ad4a7bb5b4c9f2
            timestamp:
              type: string
              format: date-time
          required:
            - requestId
            - timestamp
      required:
        - error
        - meta
paths:
  /case-types:
    get:
      operationId: listCaseTypes
      summary: List case types
      description: Returns all active case types available for creating referrals.
      tags:
        - Reference Data
      security: &ref_3
        - apiKeyAuth: []
      x-access-tier: read_only
      responses:
        "200":
          description: List of case types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CaseType"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": &ref_4
          description: Invalid or missing API key
          content: &ref_2
            application/json:
              schema: *ref_1
        "403": &ref_5
          description: API key tier does not permit this action
          content: *ref_2
  /jurisdictions:
    get:
      operationId: listJurisdictions
      summary: List jurisdictions
      description: Returns all jurisdictions (US states and territories) supported by the platform.
      tags:
        - Reference Data
      security: *ref_3
      x-access-tier: read_only
      responses:
        "200":
          description: List of jurisdictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: NY
                        name:
                          type: string
                          example: New York
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
  /counties:
    get:
      operationId: listCounties
      summary: List counties
      description: Returns counties, optionally filtered by one or more jurisdiction codes (comma-separated).
      tags:
        - Reference Data
      security: *ref_3
      x-access-tier: read_only
      parameters:
        - in: query
          name: jurisdictionCodes
          schema:
            type: string
            example: NY,NJ
          description: Comma-separated jurisdiction codes to filter by (optional)
      responses:
        "200":
          description: List of counties
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        jurisdictionCode:
                          type: string
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
  /firms/directory:
    get:
      operationId: listFirmDirectory
      summary: List firms directory
      description: Returns a directory of all active firms on the platform.
      tags:
        - Firms
      security: *ref_3
      x-access-tier: read_only
      responses:
        "200":
          description: Firm directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Firm"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
  /firms/me:
    get:
      operationId: getOwnFirm
      summary: Get the caller's firm
      description: Returns the firm associated with the API key making the request.
      tags:
        - Firms
      security: *ref_3
      x-access-tier: read_only
      responses:
        "200":
          description: Own firm record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Firm"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
    put:
      operationId: updateOwnFirm
      summary: Update the caller's firm
      description: Updates editable fields on the API key's own firm. Requires FULL tier.
      tags:
        - Firms
      security: *ref_3
      x-access-tier: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                zip:
                  type: string
                website:
                  type: string
                  format: uri
      responses:
        "200":
          description: Updated firm record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Firm"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "400": &ref_6
          description: Request validation failed
          content: *ref_2
        "401": *ref_4
        "403": *ref_5
  /firms/{id}:
    get:
      operationId: getFirmById
      summary: Get firm by ID
      description: Returns a single firm by its UUID.
      tags:
        - Firms
      security: *ref_3
      x-access-tier: read_only
      parameters:
        - &ref_7
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Resource UUID
      responses:
        "200":
          description: Firm record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Firm"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
        "404": &ref_8
          description: Resource not found
          content: *ref_2
  /cases:
    get:
      operationId: listCases
      summary: List cases
      description: >-
        Returns a paginated list of cases accessible to the caller. Supports filtering by status, date range, and
        keyword search.
      tags:
        - Cases
      security: *ref_3
      x-access-tier: read_only
      parameters:
        - &ref_9
          in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - &ref_10
          in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Results per page (max 100)
        - in: query
          name: status
          schema:
            type: string
          description: Filter by CaseStatus enum value
        - in: query
          name: search
          schema:
            type: string
          description: Keyword search across title, reference number, client name
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: view
          schema:
            type: string
            enum:
              - sent
              - received
              - all
          description: "Perspective filter (default: all)"
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: Paginated list of cases
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Case"
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
    post:
      operationId: createCase
      summary: Create a case
      description: Creates a new case referral. Requires STANDARD tier.
      tags:
        - Cases
      security: *ref_3
      x-access-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - caseType
                - jurisdiction
                - clientFirstName
                - clientLastName
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                caseType:
                  type: string
                  minLength: 1
                jurisdiction:
                  type: string
                  minLength: 1
                county:
                  type: string
                  nullable: true
                clientFirstName:
                  type: string
                  minLength: 1
                clientLastName:
                  type: string
                  minLength: 1
                clientEmail:
                  type: string
                  format: email
                clientPhone:
                  type: string
                clientDateOfBirth:
                  type: string
                  format: date
                incidentDate:
                  type: string
                  format: date
                referentFirmId:
                  type: string
                  format: uuid
                notes:
                  type: string
                source:
                  type: string
                sentExpirationHours:
                  type: integer
                  minimum: 1
                  nullable: true
                isRetainerSigned:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Case"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "400": *ref_6
        "401": *ref_4
        "403": *ref_5
  /cases/{id}:
    get:
      operationId: getCaseById
      summary: Get case by ID
      description: Returns a single case by UUID.
      tags:
        - Cases
      security: *ref_3
      x-access-tier: read_only
      parameters:
        - *ref_7
      responses:
        "200":
          description: Case record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Case"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "401": *ref_4
        "403": *ref_5
        "404": *ref_8
    put:
      operationId: updateCase
      summary: Update a case
      description: Updates editable fields on a case. Requires STANDARD tier.
      tags:
        - Cases
      security: *ref_3
      x-access-tier: standard
      parameters:
        - *ref_7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                caseType:
                  type: string
                jurisdiction:
                  type: string
                clientFirstName:
                  type: string
                clientLastName:
                  type: string
                clientEmail:
                  type: string
                  format: email
                  nullable: true
                clientPhone:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                source:
                  type: string
                phase:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Case"
                  meta: *ref_0
                required:
                  - data
                  - meta
        "400": *ref_6
        "401": *ref_4
        "403": *ref_5
        "404": *ref_8
    delete:
      operationId: deleteCase
      summary: Delete a case
      description: Permanently deletes a DRAFT case. Requires FULL tier.
      tags:
        - Cases
      security: *ref_3
      x-access-tier: full
      parameters:
        - *ref_7
      responses:
        "204":
          description: Case deleted (no content)
        "401": *ref_4
        "403": *ref_5
        "404": *ref_8
  /cases/{id}/status-history:
    get:
      operationId: getCaseStatusHistory
      summary: Get case status history
      description: Returns all historical status transitions for a case.
      tags:
        - Cases
      security: *ref_3
      x-access-tier: read_only
      parameters:
        - *ref_7
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                        notes:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        createdBy:
                          type: string
                  meta: *ref_0
                required:
                  - data
                  - meta
