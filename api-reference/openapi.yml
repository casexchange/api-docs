    Referral:
      type: object
      description: >-
        A referral as seen by either party. Referral-level fields only (financials, resolution, workflow) — client and
        case details live on the parent case. When the caller is the receiving firm and the referral is still SENT (not
        yet acknowledged), leadAttorneyName, warmTransferUnsuccessfulReason, warmTransferUnsuccessfulReasonType and
        notes are null and customFields is empty.
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
          nullable: true
          description: System-generated reference (e.g. PREFIX-0001)
        status:
          type: string
          enum:
            - draft
            - sent
            - received
            - under_evaluation
            - investigating
            - signed
            - in_litigation
            - closing
            - won
            - lost
            - closed
            - rejected
            - withdrawn
            - pending_spin_off
          description: The referral's shared status. The legacy 'received' value is reported as 'under_evaluation'.
        closingStatus:
          type: string
          enum:
            - won_settled
            - lost
            - no_longer_pursuing
          nullable: true
        payoutType:
          type: string
          enum:
            - lump_sum
            - structured
            - hybrid
            - other
          nullable: true
        closureReason:
          type: string
          nullable: true
        referringFirmId:
          type: string
          format: uuid
          description: Sending firm
        referentFirmId:
          type: string
          format: uuid
          nullable: true
          description: Receiving firm; null while the referral is a DRAFT
        settlementAmount:
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Final settlement amount in dollars
        attorneyFees:
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Attorney fees in dollars
        projectedSettlementAmount:
          type: number
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: Projected settlement amount in dollars
        estimatedDateOfResolution:
          type: string
          format: date-time
          nullable: true
        estimatedDistributionDate:
          type: string
          format: date-time
          nullable: true
        statuteOfLimitationsExpiration:
          type: string
          format: date-time
          nullable: true
        clientFeeAgreementPercentage: *ref_5
        sendingFirmPercentage: &ref_12
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: >-
            Referral fee owed to the sending firm as a WHOLE-NUMBER percent of attorney fees (33.33 = 33.33%). Input
            values strictly between 0 and 1 are rejected as likely fractions; 0 means no fee.
        netFeeToSendingFirm:
          type: number
          nullable: true
          description: >-
            attorneyFees × the sendingFirmPercentage published on this record ÷ 100, rounded to cents. Null when either
            input is missing or zero.
        netFeeToHandlingFirm:
          type: number
          nullable: true
          description: attorneyFees − netFeeToSendingFirm. Null when netFeeToSendingFirm is null.
        resolutionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the outcome was recorded: the most recent transition into CLOSING, or into WON/LOST for legacy
            referrals that never passed through CLOSING.
        closedDate:
          type: string
          format: date-time
          nullable: true
          description: The most recent transition into CLOSED.
        leadAttorneyName:
          type: string
          nullable: true
        warmTransferSuccessful:
          type: boolean
          description: Whether the warm transfer to the receiving firm succeeded.
        warmTransferUnsuccessfulReason:
          type: string
          nullable: true
          description: >-
            Free-text explanation when the warm transfer was unsuccessful. Only populated when
            warmTransferUnsuccessfulReasonType is OTHER. Masked (null) for the receiving firm while the referral is
            still SENT.
        warmTransferUnsuccessfulReasonType:
          type: string
          nullable: true
          enum:
            - FIRM_UNABLE_TO_ANSWER
            - CLIENT_UNABLE_TO_CONTINUE
            - OTHER
          description: >-
            Reason category for an unsuccessful warm transfer. Masked (null) for the receiving firm while the referral
            is still SENT.
        phase:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
          description: Aggregated referral notes visible to the caller
        isRetainerSigned:
          type: boolean
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomFieldValue"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - referenceNumber
        - status
        - closingStatus
        - payoutType
        - closureReason
        - referringFirmId
        - referentFirmId
        - settlementAmount
        - attorneyFees
        - projectedSettlementAmount
        - estimatedDateOfResolution
        - estimatedDistributionDate
        - statuteOfLimitationsExpiration
        - clientFeeAgreementPercentage
        - sendingFirmPercentage
        - netFeeToSendingFirm
        - netFeeToHandlingFirm
        - resolutionDate
        - closedDate
        - leadAttorneyName
        - warmTransferSuccessful
        - warmTransferUnsuccessfulReason
        - warmTransferUnsuccessfulReasonType
        - phase
        - notes
        - isRetainerSigned
        - customFields
        - createdAt
        - updatedAt
