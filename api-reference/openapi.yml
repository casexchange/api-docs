paths:
  /referrals:
    get:
      operationId: listReferrals
      summary: List referrals
      description: >-
        Paginated list of referrals where the caller's firm is either the sending or receiving firm, newest first.
        Archived referrals are excluded. The status filter is symmetric across both directions because a referral's
        status is the truth both firms share.
      tags: &ref_20
        - Referrals
      security: &ref_21
        - apiKeyAuth: []
      x-access-tier: read_only
      parameters:
        - &ref_34
          in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - &ref_35
          in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Results per page (max 100)
        - &ref_36
          in: query
          name: status
          schema:
            type: string
            enum:
              - draft
              - sent
              - received
              - under_evaluation
              - investigating
              - signed
              - in_litigation
              - closing
              - won
              - lost
              - closed
              - rejected
              - withdrawn
              - pending_spin_off
          description: >-
            Filter by CaseStatus. 'terminated' and 'exhausted' are rejected with 400: they are the sending firm's
            private categorization of a rejected referral, not referral statuses.
      responses:
        "200":
          description: Paginated list of referrals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Referral"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  meta: *ref_17
                required:
                  - data
                  - pagination
                  - meta
        "400": &ref_22
          description: Request validation failed
          content: &ref_19
            application/json:
              schema: *ref_18
        "401": &ref_23
          description: Invalid or missing API key
          content: *ref_19
        "403": &ref_24
          description: API key tier does not permit this action
          content: *ref_19
  /referrals/match:
    post:
      operationId: matchReferrals
      summary: Find referrals by client identifiers
      description: >-
        Searches the caller's firm's referrals for clients matching the supplied identifiers and returns ranked
        candidates with a confidence score and the fields that matched. At least one identifier is required. Requires
        STANDARD tier (POST requests are rate-classified as writes even though this is a search). Note: the response
        body is `{ candidates, meta }` — the candidate array is not nested under `data`.
      tags: *ref_20
      security: *ref_21
      x-access-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifiers
              additionalProperties: false
              properties:
                identifiers:
                  type: object
                  additionalProperties: false
                  description: At least one identifier must be provided
                  properties:
                    firstName:
                      type: string
                      minLength: 1
                      maxLength: 100
                    lastName:
                      type: string
                      minLength: 1
                      maxLength: 100
                    dateOfBirth:
                      type: string
                      format: date
                      description: YYYY-MM-DD
                    email:
                      type: string
                      format: email
                      maxLength: 254
                    phone:
                      type: string
                      minLength: 7
                      maxLength: 40
                      description: Compared after normalizing to digits
      responses:
        "200":
          description: Ranked match candidates (best first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/MatchCandidate"
                  meta: *ref_17
                required:
                  - candidates
                  - meta
        "400": *ref_22
        "401": *ref_23
        "403": *ref_24
  /referrals/{id}/status-history:
    get:
      operationId: getReferralStatusHistory
      summary: Get referral status history
      description: >-
        Returns the status-history entries both firms share for a referral, newest first. The sending firm's private
        categorization entries are never included.
      tags: *ref_20
      security: *ref_21
      x-access-tier: read_only
      parameters:
        - &ref_25
          in: path
          name: id
          required: true
          schema: &ref_45
            type: string
            format: uuid
          description: Resource UUID
      responses:
        "200":
          description: Status history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReferralStatusUpdate"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "400": *ref_22
        "401": *ref_23
        "403": *ref_24
        "404": &ref_26
          description: Resource not found
          content: *ref_19
  /referrals/{id}/available-statuses:
    get:
      operationId: getReferralAvailableStatuses
      summary: Get available status transitions
      description: >-
        Returns the next status transitions the caller's firm may perform on this referral, based on whether the firm is
        the sender or the receiver.
      tags: *ref_20
      security: *ref_21
      x-access-tier: read_only
      parameters:
        - *ref_25
      responses:
        "200":
          description: Available transitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AvailableStatuses"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "400": *ref_22
        "401": *ref_23
        "403": *ref_24
        "404": *ref_26
  /referrals/{id}:
    get:
      operationId: getReferral
      summary: Get referral by ID
      description: Returns a single referral by UUID. The caller's firm must be the sending or receiving firm; otherwise 404.
      tags: *ref_20
      security: *ref_21
      x-access-tier: read_only
      parameters:
        - *ref_25
      responses:
        "200":
          description: Referral record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Referral"
                  meta: *ref_17
                required:
                  - data
                  - meta
        "400": *ref_22
        "401": *ref_23
        "403": *ref_24
        "404": *ref_26
    put:
      operationId: updateReferral
      summary: Update a referral
      description: >-
        Updates editable referral-level fields. Unknown fields are rejected and at least one field must be provided.
        Which fields a firm may edit depends on its role and the referral status (for example, the sending firm may only
        edit notes while the referral is DRAFT, SENT, REJECTED or WITHDRAWN; custom fields are receiver-only after
        signing); disallowed edits return 403. When both are supplied, attorneyFees must not exceed settlementAmount.
        Requires STANDARD tier.
      tags: *ref_20
      security: *ref_21
      x-access-tier: standard
      parameters:
        - *ref_25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                notes:
                  type: string
                  maxLength: 10000
                  nullable: true
                leadAttorneyName:
                  type: string
                  maxLength: 500
                  nullable: true
                statuteOfLimitationsExpiration:
                  type: string
                  format: date
                  nullable: true
                  description: YYYY-MM-DD
                clientFeeAgreementPercentage: *ref_5
                attorneyFees:
                  type: number
                  minimum: 0
                  maximum: 1000000000
                  nullable: true
                  description: Attorney fees in dollars
                estimatedDateOfResolution:
                  type: string
                  format: date
                  nullable: true
                  description: YYYY-MM-DD
                estimatedDistributionDate:
                  type: string
                  format: date
                  nullable: true
                  description: YYYY-MM-DD
                projectedSettlementAmount:
                  type: number
                  minimum: 0
                  maximum: 1000000000
                  nullable: true
                  description: Projected settlement amount in dollars
                phase:
                  type: string
                  maxLength: 200
                  nullable: true
                sendingFirmPercentage: *ref_12
                settlementAmount:
                  type: number
                  minimum: 0
                  maximum: 1000000000
                  nullable: true
                  description: Final settlement amount in dollars
                payoutType:
                  type: string
                  enum:
                    - lump_sum
                    - structured
                    - hybrid
                    - other
                  nullable: true
                isRetainerSigned:
                  type: boolean
                customFields: &ref_38
                  type: array
                  description: >-
                    Custom field values to set. Custom fields can only be updated by the receiving firm once the
                    referral is SIGNED or later; otherwise the request is rejected with 403.
                  items:
                    type: object
