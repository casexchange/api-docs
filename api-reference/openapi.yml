      operationId: listSentCases
      summary: List sent cases
      description: Paginated list of cases owned by the caller's firm, each with its most-recent referral.
      tags:
        - Sent Cases
      security: *ref_16
      x-access-tier: read_only
      parameters:
        - *ref_30
        - *ref_31
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - sent
              - received
              - under_evaluation
              - investigating
              - signed
              - in_litigation
              - closing
              - won
              - lost
              - closed
              - rejected
              - withdrawn
              - pending_spin_off
          description: Filter by CaseStatus
        - name: closingStatus
          in: query
          schema:
            type: string
          description: Filter by ClosingStatus
        - name: search
          in: query
          schema:
            type: string
          description: Reference number or receiving firm name
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - updatedAt
              - createdAt
              - status
              - referenceNumber
          description: >-
            Sort field, default updatedAt. createdAt sorts by the most-recent referral's creation time (when the case
            was sent/re-referred), not the draft-creation date.
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: Sent cases list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SentCaseListItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  meta: *ref_12
                required:
                  - data
                  - pagination
                  - meta
        "401": *ref_18
        "403": *ref_19
    post:
      operationId: createSentCase
      summary: Create a sent case
      description: >-
        Creates a case owned by the caller's firm. If referentFirmId is provided the case is SENT; otherwise it is
        created as a DRAFT. Pass routingRuleId + roundRobinPosition (from GET /routing/evaluate) to advance the
        round-robin pointer. Requires STANDARD tier.
      tags:
        - Sent Cases
      security: *ref_16
      x-access-tier: standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - caseType
                - jurisdiction
                - clientFirstName
                - clientLastName
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                caseType:
                  type: string
                  minLength: 1
                jurisdiction:
                  type: string
                  minLength: 1
                county:
                  type: string
                  nullable: true
                clientFirstName:
                  type: string
                  minLength: 1
                clientLastName:
                  type: string
                  minLength: 1
                clientEmail:
                  type: string
                  format: email
                clientPhone:
                  type: string
                clientDateOfBirth:
                  type: string
                  format: date
                  nullable: true
                incidentDate:
                  type: string
                  format: date
                  nullable: true
                tier:
                  type: integer
                  minimum: 1
                  maximum: 5
                  nullable: true
                source:
                  type: string
                notes:
                  type: string
                referentFirmId:
                  type: string
                  format: uuid
                  description: Receiving firm. Omit to create a DRAFT.
                routingRuleId:
                  type: string
                  format: uuid
                  description: >-
                    Optional. Routing rule this send was chosen from (from GET /routing/evaluate). Ignored (with a
                    server-side warning) if it is not a live rule owned by your firm.
                roundRobinPosition:
                  type: integer
                  minimum: 0
                  description: >-
                    Optional. The roundRobinPosition from GET /routing/evaluate. Requires routingRuleId; advances the
                    rule's round-robin pointer.
                isRetainerSigned:
                  type: boolean
                  default: false
                salesforceId:
                  type: string
                salesforceObjectType:
                  type: string
                externalSystem:
                  type: string
                  enum:
                    - cloudlex
                    - morgan_morgan
                externalId:
                  type: string
      responses:
        "201":
          description: Created sent case
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SentCase"
                  meta: *ref_12
                required:
                  - data
                  - meta
        "400": *ref_17
        "401": *ref_18
        "403": *ref_19
        "409":
          description: A referral for this Salesforce record already exists
          content: *ref_14
